        const registro = base.controladores.find((c) => c.login === normalizarLogin(login));
        if (!registro || !(await verificarSenha(senha, registro))) {
          await esperar(500);
          formulario.definirErro('senha', 'Login ou senha incorretos.');
          return;
        }
        modal.fechar();
        entrar('controlador', { login: registro.login, nome: registro.nome || registro.login });
      },
    });
    const focarSenha = ligarLoginASenha(formulario);
    const modal = criarModal({
      titulo: 'Entrar como Controlador',
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: formulario.elemento,
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: 'Entrar', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    modal.abrir();
    focarSenha();
  }

  /* ---- Administrador ---- */
  function abrirAdministracao(senhaMestra) {
    if (!base) base = criarBaseVazia(formato);
    let tabela = null;

    const atualizarTabela = () => tabela.definirDados(base.controladores);
    tabela = criarTabela({
      compacta: true,
      altura: 'auto',
      dados: base.controladores,
      vazio: { titulo: 'Nenhum controlador cadastrado', mensagem: 'Use o formulário abaixo para adicionar.' },
      colunas: [
        { campo: 'login', titulo: 'Login' },
        { campo: 'nome', titulo: 'Nome' },
        {
          campo: 'senha', titulo: 'Senha', ordenavel: false,
          render: (_, linha) => {
            const oculto = '••••••••';
            const botao = criarBotao({ texto: oculto, icone: 'olho', variante: 'ghost', tamanho: 'sm', titulo: 'Mostrar senha' });
            const texto = botao.querySelector('span');
            let visivel = false;
            botao.addEventListener('click', async () => {
              if (visivel) {
                texto.textContent = oculto;
                visivel = false;
                botao.title = 'Mostrar senha';
                return;
              }
              if (!linha.senhaCifrada || !criptografiaDisponivel()) {
                toast.aviso('Senha não disponível', 'Este controlador foi cadastrado antes desta versão. Remova-o e cadastre de novo para poder visualizar a senha.');
                return;
              }
              try {
                texto.textContent = await comCarregamento(botao, () => decifrarTexto(linha.senhaCifrada, senhaMestra, linha.sal));
                visivel = true;
                botao.title = 'Ocultar senha';
              } catch (erro) {
                toast.erro('Não foi possível mostrar a senha', 'A base pode ter sido alterada fora do aplicativo.');
              }
            });
            return botao;
          },
        },
        { campo: 'criadoEm', titulo: 'Cadastrado em', formatar: (v) => formatarData(v, 'data-hora') },
        {
          campo: 'acoes', titulo: '', ordenavel: false, classe: 'ctc-col--actions',
          render: (_, linha) => criarBotao({
            icone: 'lixeira', variante: 'ghost', tamanho: 'sm', titulo: `Remover ${linha.login}`,
            onClick: async () => {
              const ok = await confirmar({ titulo: `Remover ${linha.login}?`, mensagem: 'Este controlador não conseguirá mais entrar com a base exportada a partir de agora.', textoConfirmar: 'Remover', perigo: true });
              if (!ok) return;
              base.controladores = base.controladores.filter((c) => c !== linha);
              pendenteExportar = true;
              atualizarTabela();
              atualizarStatus();
              toast.aviso('Controlador removido', 'Exporte a base para gravar a alteração.');
            },
          }),
        },
      ],
    });

    const formulario = criarFormulario({
      colunas: 2,
      textoEnviar: 'Adicionar controlador',
      campos: [
        { nome: 'nome', rotulo: 'Nome', obrigatorio: true },
        {
          nome: 'login', rotulo: 'Login', obrigatorio: true, dica: 'De 3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.',
          regras: {
            validar: (v) => {
              if (!/^[a-zA-Z0-9._-]{3,30}$/.test(String(v).trim())) return 'Use de 3 a 30 letras, números, ponto, hífen ou sublinhado.';
              if (base.controladores.some((c) => c.login === normalizarLogin(v))) return 'Este login já está cadastrado.';
              return true;
            },
          },
        },
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true, regras: { minCaracteres: 6 }, atributos: { autocomplete: 'new-password' } },
        {
          nome: 'confirmacao', rotulo: 'Confirmar senha', tipo: 'senha', obrigatorio: true, atributos: { autocomplete: 'new-password' },
          regras: { validar: (v, valores) => v === valores.senha || 'As senhas não conferem.' },
        },
      ],
      onEnviar: async ({ nome, login, senha }) => {
        base.controladores.push(await criarCredencial({ login, nome, senha, senhaMestra }));
        pendenteExportar = true;
        formulario.elemento.reset();
        formulario.limparErros();
        atualizarTabela();
        atualizarStatus();
        toast.sucesso('Controlador adicionado', `${normalizarLogin(login)} — exporte a base para gravar.`);
      },
    });

    /* ---- Banco de dados na nuvem (Firebase) ---- */
    let modalAdmin = null;
    let painelNuvem = null;
    if (armazenamento && armazenamento.configurar) {
      const statusNuvem = h('div', {});
      const atualizarStatusNuvem = () => {
        const cfg = armazenamento.obterConfig();
        statusNuvem.replaceChildren(cfg
          ? criarAlerta({ tipo: 'success', titulo: `Conectado ao Firebase — projeto ${cfg.projectId}`, mensagem: 'Salvar na nuvem, Salvar na base existente e Abrir versão salva usam este banco.' })
          : criarAlerta({ tipo: 'info', titulo: 'Firebase não configurado', mensagem: 'Enquanto isso, as versões ficam guardadas somente neste navegador.' }));
      };
      const campoConfig = criarCampo({
        nome: 'firebaseConfig', rotulo: 'Configuração do Firebase (firebaseConfig)', tipo: 'textarea', larguraTotal: true,
        placeholder: 'Cole aqui o trecho do console do Firebase:\nconst firebaseConfig = {\n  apiKey: "...",\n  projectId: "...",\n  appId: "..."\n};',
        dica: 'Console do Firebase > Configurações do projeto > Seus apps > SDK setup and configuration.',
      });
      const textoConfig = campoConfig.querySelector('textarea');
      const cfgAtual = armazenamento.obterConfig();
      if (cfgAtual) textoConfig.value = `const firebaseConfig = ${JSON.stringify(cfgAtual, null, 2)};`;

      const botaoConectar = criarBotao({
        texto: 'Salvar e conectar', icone: 'upload', variante: 'primary',
        onClick: async () => {
          const leitura = interpretarConfigFirebase(textoConfig.value);
          if (!leitura.valido) { toast.erro('Configuração incompleta', leitura.erros.join(' ')); return; }
          try {
            const { versoes } = await comCarregamento(botaoConectar, () => armazenamento.configurar(leitura.config));
            base.nuvem = { ...(base.nuvem || {}), firebase: leitura.config };
            atualizarStatusNuvem();
            atualizarStatus();
            toast.sucesso('Firebase conectado', `Projeto ${leitura.config.projectId} — ${versoes.length} versão(ões) encontrada(s).`);
            // ja traz as versoes da nuvem para escolher qual abrir
            if (versoes.length) { modalAdmin.fechar(); abrirVersaoSalva(); }
          } catch (erro) {
            toast.erro('Não foi possível conectar', erro.message);
          }
        },
      });
      const botaoRemoverNuvem = criarBotao({
        texto: 'Remover configuração', icone: 'lixeira', variante: 'ghost',
        onClick: async () => {
          const ok = await confirmar({ titulo: 'Remover a configuração do Firebase?', mensagem: 'Os dados na nuvem não são apagados; este navegador apenas deixa de usá-los.', textoConfirmar: 'Remover', perigo: true });
          if (!ok) return;
          armazenamento.removerConfig();
          if (base.nuvem) delete base.nuvem.firebase;
          textoConfig.value = '';
          atualizarStatusNuvem();
          toast.info('Configuração removida', 'As versões voltam a ser guardadas neste navegador.');
        },
      });
      atualizarStatusNuvem();
      painelNuvem = criarPainel({
        titulo: 'Banco de dados na nuvem (Firebase)', icone: 'configuracao',
        conteudo: h('div', { class: 'ctc-stack' },
          statusNuvem,
          campoConfig,
          h('div', { class: 'ctc-cluster' }, botaoConectar, botaoRemoverNuvem),
          criarAlerta({
            tipo: 'warning',
            titulo: 'Regras de acesso do Firestore',
            mensagem: 'Este modelo não usa login do Firebase. As regras do banco precisam permitir leitura e escrita, e qualquer pessoa com esta configuração consegue acessar os dados. Use apenas para dados internos e revise as regras no console.',
          })),
      }).elemento;
    }

    modalAdmin = criarModal({
      titulo: 'Administração de controladores',
      tamanho: 'lg',
      destruirAoFechar: true,
      conteudo: [
        criarAlerta({
          tipo: 'info',
          titulo: 'Os controladores ficam gravados dentro do arquivo JSON',
          mensagem: 'Depois de adicionar ou remover, clique em "Exportar base (JSON)" e passe a usar o novo arquivo.',
        }),
        criarPainel({ titulo: 'Controladores cadastrados', icone: 'usuario', semEspaco: true, conteudo: tabela.elemento }).elemento,
        criarPainel({ titulo: 'Novo controlador', icone: 'mais', conteudo: formulario.elemento }).elemento,
        painelNuvem,
      ],
      acoes: [
        { texto: 'Fechar', variante: 'outline' },
        {
          texto: 'Exportar base (JSON)', icone: 'download', variante: 'primary', fechar: false,
          onClick: () => {
            const nome = nomeArquivoBase(prefixoArquivo || formato || 'base');
            base = prepararBaseParaSalvar(base);
            baixarJSON(base, nome);
            pendenteExportar = false;
            atualizarStatus();
            toast.sucesso('Base exportada', `${nome} — use este arquivo na próxima abertura.`);
          },
        },
      ],
    });
    modalAdmin.abrir();
  }

  async function entrarAdministrador() {
    const senha = await solicitarSenhaAdministrador({ administrador, titulo: 'Acesso do Administrador', textoConfirmar: 'Entrar' });
    if (senha) abrirAdministracao(senha);
  }

  /* ---- Iniciar controle: base em branco, liberada pela senha do administrador ---- */
  async function iniciarControle() {
    if (importada || pendenteExportar) {
      const ok = await confirmar({
        titulo: 'Iniciar um controle em branco?',
        mensagem: 'A base carregada sai da tela inicial (o arquivo ou a versão na nuvem não são alterados). Os dados novos só ficam gravados quando você salvar.',
        textoConfirmar: 'Iniciar em branco',
      });
      if (!ok) return;
    }
    const senha = await solicitarSenhaAdministrador({
      administrador,
      titulo: 'Iniciar controle',
      mensagem: 'Informe a senha do administrador para criar uma base em branco.',
      textoConfirmar: 'Criar base em branco',
    });
    if (!senha) return;
    const nova = typeof criarBaseNova === 'function' ? criarBaseNova() : criarBaseVazia(formato);
    base = validarBase({ ...nova, formato }, { formato }).base;
    nomeArquivo = 'Novo controle (ainda não salvo)';
    importada = true;
    pendenteExportar = false;
    atualizarStatus();
    toast.sucesso('Base em branco criada', 'Comece a atualizar e salve em Controlador > Ferramentas.');
    entrar('administrador', { login: 'administrador', nome: 'Administrador' });
  }

  /* v1.8.0: Importar e Iniciar controle em cartoes lado a lado; perfil em botao segmentado + Entrar */
  const cartaoEntrada = ({ icone, cor, titulo: t, sub, onClick, mini = false, dica }) => h('button', {
    type: 'button', class: classes('ctc-entrada-acao', `ctc-entrada-acao--${cor}`, mini && 'ctc-entrada-acao--mini'), title: dica || t, onClick,
  },
  h('span', { class: 'ctc-entrada-acao__ico', 'aria-hidden': 'true' }, criarIcone(icone, mini ? 20 : 24)),
  h('b', { class: 'ctc-entrada-acao__titulo' }, t),
  h('span', { class: 'ctc-entrada-acao__sub' }, sub));

  const opcoesImportar = h('div', { class: 'ctc-entrada-opcoes', hidden: true },
    cartaoEntrada({ icone: 'upload', cor: 'ambar', titulo: 'Arquivo JSON', sub: 'Do computador', mini: true, onClick: () => entrada.click() }),
    armazenamento ? cartaoEntrada({ icone: 'documento', cor: 'azul', titulo: 'Versão na nuvem', sub: 'Abrir uma versão salva', mini: true, onClick: abrirVersaoSalva }) : null);
  const botaoImportar = cartaoEntrada({
    icone: 'upload', cor: 'marinho', titulo: 'Importar', sub: armazenamento ? 'Nuvem ou arquivo JSON' : 'Arquivo JSON',
    dica: 'Importar a base de dados',
    onClick: () => {
      const abrir = opcoesImportar.hidden;
      opcoesImportar.hidden = !abrir;
      botaoImportar.classList.toggle('is-open', abrir);
      botaoImportar.setAttribute('aria-expanded', String(abrir));
    },
  });
  botaoImportar.setAttribute('aria-expanded', 'false');
  const botaoIniciar = cartaoEntrada({
    icone: 'mais', cor: 'verde', titulo: 'Iniciar controle', sub: 'Em branco (senha do admin.)',
    dica: 'Iniciar um controle em branco (pede a senha do administrador)', onClick: iniciarControle,
  });

  const ENTRAR_POR_PERFIL = { visualizador: entrarVisualizador, controlador: entrarControlador, administrador: entrarAdministrador };
  const seletorPerfil = criarSegmentado({
    rotulo: 'Acessar como',
    valor: 'visualizador',
    opcoes: [
      { valor: 'visualizador', texto: 'Visualizador' },
      { valor: 'controlador', texto: 'Controlador' },
      { valor: 'administrador', texto: 'Administrador' },
    ],
  });
  seletorPerfil.elemento.classList.add('ctc-entrada-perfis');

  const elemento = h('div', { class: 'ctc-landing' },
    h('div', { class: 'ctc-landing__card' },
      h('div', { class: 'ctc-landing__brand' },
        elLogoEntrada,
        elTituloEntrada,
        h('p', { class: 'ctc-landing__subtitle' }, subtitulo)),
      h('div', { class: 'ctc-entrada-acoes' }, botaoImportar, botaoIniciar),
      opcoesImportar,
      status,
      linkRemover,
      entrada,
      h('div', { class: 'ctc-landing__section-title ctc-entrada-rotulo' }, 'ACESSAR COMO'),
      seletorPerfil.elemento,
      criarBotao({ texto: 'Entrar', variante: 'primary', tamanho: 'lg', bloco: true, onClick: () => ENTRAR_POR_PERFIL[seletorPerfil.obterValor()]() }),
      rodape ? h('div', { class: 'ctc-landing__footer' }, rodape) : null));

  atualizarStatus();

  return {
    elemento,
    mostrar: (alvo = document.body) => { atualizarStatus(); alvo.append(elemento); },
    remover: () => elemento.remove(),
    obterBase: () => base,
    /** Atualiza a base mantida na tela (ex.: a versao que acabou de ser salva no aplicativo). */
    definirBase: (novaBase, novoNome = nomeArquivo) => {
      const resultado = validarBase(JSON.parse(JSON.stringify(novaBase)), { formato });
      if (!resultado.valida) return false;
      base = resultado.base;
      nomeArquivo = novoNome;
      importada = Boolean(novoNome);
      atualizarStatus();
      return true;
    },
  };
}

/**
 * Botao do canto superior direito que mostra o perfil e o numero de alteracoes nao salvas.
 * criarBotaoSessao({ sessao, texto: 'Controlador', onClick })
 */
function criarBotaoSessao({ sessao, texto = 'Controlador', onClick } = {}) {
  const botao = criarBotao({ texto, icone: 'usuario', variante: 'outline', contador: 0, onClick });
  const contador = botao.querySelector('.ctc-btn__count');
  const atualizar = ({ alteracoes }) => {
    contador.textContent = String(alteracoes);
    contador.classList.toggle('ctc-hidden', !alteracoes);
    botao.title = alteracoes ? `${alteracoes} alteração(ões) não salva(s)` : texto;
  };
  atualizar(sessao.obter());
  sessao.assinar(atualizar);
  return botao;
}

/**
 * Pede a senha do administrador. Retorna Promise<senha | null> (null = cancelado).
 *   const senha = await solicitarSenhaAdministrador({ administrador: { sal, hash } })
 */
function solicitarSenhaAdministrador({
  administrador = {}, titulo = 'Senha do administrador', mensagem, textoConfirmar = 'Confirmar',
} = {}) {
  return new Promise((resolver) => {
    let resposta = null;
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [{ nome: 'senha', rotulo: 'Senha do administrador', tipo: 'senha', obrigatorio: true }],
      onEnviar: async ({ senha }) => {
        if (!(await verificarSenha(senha, administrador))) {
          await esperar(500);
          formulario.definirErro('senha', 'Senha incorreta.');
          return;
        }
        resposta = senha;
        modal.fechar();
      },
    });
    const modal = criarModal({
      titulo,
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: [mensagem ? h('p', { class: 'ctc-text-sm ctc-text-muted' }, mensagem) : null, formulario.elemento],
      onFechar: () => resolver(resposta),
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: textoConfirmar, variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    modal.abrir();
  });
}

/**
 * Pede login e senha de um controlador novamente (confirmacao antes de acoes sensiveis).
 * Retorna Promise<{ login, nome } | null> (null = cancelado).
 *   const quem = await solicitarCredenciais({ controladores: base.controladores, titulo: 'Confirme seu acesso', loginPadrao })
 * O controlador e escolhido numa lista; loginPadrao ja deixa um selecionado.
 */
function solicitarCredenciais({
  controladores = [], titulo = 'Confirme seu acesso', mensagem = 'Informe novamente seu login e senha de controlador.',
  textoConfirmar = 'Confirmar', loginPadrao,
} = {}) {
  return new Promise((resolver) => {
    let resposta = null;
    const formulario = criarFormulario({
      colunas: 1,
      semBotoes: true,
      campos: [
        campoLoginControlador(controladores, loginPadrao),
        { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorio: true },
      ],
      onEnviar: async ({ login, senha }) => {
        const registro = controladores.find((c) => c.login === normalizarLogin(login));
        if (!registro || !(await verificarSenha(senha, registro))) {
          await esperar(500);
          formulario.definirErro('senha', 'Login ou senha incorretos.');
          return;
        }
        resposta = { login: registro.login, nome: registro.nome || registro.login };
        modal.fechar();
      },
    });
    const modal = criarModal({
      titulo,
      tamanho: 'sm',
      destruirAoFechar: true,
      conteudo: [h('p', { class: 'ctc-text-sm ctc-text-muted' }, mensagem), formulario.elemento],
      onFechar: () => resolver(resposta),
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        { texto: textoConfirmar, variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
      ],
    });
    const focarSenha = ligarLoginASenha(formulario);
    modal.abrir();
    focarSenha();
  });
}

/**
 * Lista as versoes salvas e permite escolher uma.
 *   abrirListaVersoes({ armazenamento, titulo, textoAcao: 'Abrir', varianteAcao, perigo,
 *                       onEscolher: async (versao) => true | false })   // false mantem a lista aberta
 */
async function abrirListaVersoes({
  armazenamento, titulo = 'Versões salvas', textoAcao = 'Abrir', varianteAcao = 'primary', onEscolher,
} = {}) {
  let versoes;
  try {
    versoes = await armazenamento.listar();
  } catch (erro) {
    toast.erro('Não foi possível listar as versões', erro.message);
    return null;
  }
  let modal = null;
  const tabela = criarTabela({
    dados: versoes,
    compacta: true,
    altura: 'auto',
    ordenacao: { campo: 'salvoEm', direcao: 'desc' },
    vazio: { titulo: 'Nenhuma versão salva ainda', mensagem: 'Use "Salvar na nuvem" no painel do Controlador para criar a primeira.' },
    colunas: [
      { campo: 'nome', titulo: 'Nome' },
      { campo: 'salvoEm', titulo: 'Salvo em', tipo: 'data', formatar: (v) => formatarData(v, 'data-hora') },
      { campo: 'autor', titulo: 'Salvo por' },
      {
        campo: 'acao', titulo: '', ordenavel: false, classe: 'ctc-col--actions',
        render: (_, versao) => {
          const botao = criarBotao({ texto: textoAcao, variante: varianteAcao, tamanho: 'sm' });
          botao.addEventListener('click', async () => {
            const fechar = await comCarregamento(botao, () => onEscolher(versao));
            if (fechar !== false) modal.fechar();
          });
          return botao;
        },
      },
    ],
  });
  modal = criarModal({
    titulo,
    tamanho: 'lg',
    destruirAoFechar: true,
    conteudo: [
      armazenamento.descricao ? h('p', { class: 'ctc-text-xs ctc-text-muted' }, `Local de armazenamento: ${armazenamento.descricao}`) : null,
      tabela.elemento,
    ],
    acoes: [{ texto: 'Fechar', variante: 'outline' }],
  });
  modal.abrir();
  return modal;
}

/**
 * Editor do cabecalho: logo (imagem importada), titulo e subtitulo.
 *   abrirEditorCabecalho({ identidade: { logo, titulo, subtitulo }, onSalvar(novaIdentidade) })
 */
function abrirEditorCabecalho({ identidade = {}, onSalvar } = {}) {
  let logo = identidade.logo || null;
  const previa = h('div', { class: 'ctc-landing__logo' });
  const atualizarPrevia = () => {
    previa.replaceChildren(conteudoLogo(logo || '—'));
    botaoRemover.disabled = !logo;
  };
  const entradaImagem = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml', class: 'ctc-hidden', tabindex: '-1', 'aria-hidden': 'true' });
  entradaImagem.addEventListener('change', async () => {
    const arquivo = entradaImagem.files[0];
    entradaImagem.value = '';
    if (!arquivo) return;
    try {
      logo = await lerImagemComoDataURL(arquivo);
      atualizarPrevia();
    } catch (erro) {
      toast.erro('Imagem não carregada', erro.message);
    }
  });
  const botaoRemover = criarBotao({ texto: 'Remover logo', icone: 'lixeira', variante: 'ghost', tamanho: 'sm', onClick: () => { logo = null; atualizarPrevia(); } });

  const formulario = criarFormulario({
    colunas: 1,
    semBotoes: true,
    valores: { titulo: identidade.titulo || '', subtitulo: identidade.subtitulo || '' },
    campos: [
      { nome: 'titulo', rotulo: 'Título do cabeçalho', obrigatorio: true, regras: { maxCaracteres: 60 } },
      { nome: 'subtitulo', rotulo: 'Subtítulo', dica: 'Ex.: nome da obra, contrato ou unidade. Opcional.', regras: { maxCaracteres: 90 } },
    ],
    onEnviar: ({ titulo, subtitulo }) => {
      if (typeof onSalvar === 'function') onSalvar({ logo, titulo, subtitulo });
      modal.fechar();
    },
  });

  const modal = criarModal({
    titulo: 'Editar cabeçalho e logo',
    tamanho: 'md',
    destruirAoFechar: true,
    conteudo: [
      h('div', { class: 'ctc-cluster' },
        previa,
        h('div', { class: 'ctc-stack' },
          criarBotao({ texto: 'Importar imagem da logo', icone: 'upload', variante: 'outline', tamanho: 'sm', onClick: () => entradaImagem.click() }),
          botaoRemover,
          h('div', { class: 'ctc-text-xs ctc-text-muted' }, 'PNG, JPG, GIF, WEBP ou SVG. A imagem é reduzida para caber na base.')),
        entradaImagem),
      formulario.elemento,
    ],
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      { texto: 'Aplicar', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
    ],
  });
  atualizarPrevia();
  modal.abrir();
  return modal;
}

/**
 * Abre o painel do controlador.
 *   abrirPainelControlador({
 *     sessao, titulo: 'Controlador', prefixoArquivo,
 *     obterBaseParaSalvar: () => base,   // o aplicativo monta a base atual (dados + controladores)
 *     armazenamento,                     // provedor de versoes: habilita "Salvar na nuvem" e "Salvar na base existente"
 *     administrador: { sal, hash },      // confirma os salvamentos de quem entrou como administrador
 *     onEditarCabecalho: () => {},       // habilita o bloco "Cabecalho e logo"
 *     onSair: () => { ... },             // trocar perfil / voltar a tela de entrada
 *     abasExtras: [{ id, texto, conteudo }],
 *   })
 * Os dois salvamentos em versao pedem login e senha de novo antes de abrir.
 */
function abrirPainelControlador({
  sessao, titulo = 'Controlador', prefixoArquivo = 'base', obterBaseParaSalvar, armazenamento, administrador,
  onEditarCabecalho, onSair, abasExtras = [],
} = {}) {
  let modal = null;
  let abas = null;
  const atualizarAba = () => { if (modal && modal.estaAberto()) abas.ativar('ferramentas'); };
  /* a configuracao da nuvem viaja junto com a base salva */
  const baseAtual = () => {
    const base = obterBaseParaSalvar();
    const configNuvem = armazenamento && armazenamento.obterConfig ? armazenamento.obterConfig() : null;
    return configNuvem ? { ...base, nuvem: { ...(base.nuvem || {}), firebase: configNuvem } } : base;
  };

  async function confirmarAcesso(acao) {
    // quem entrou por "Iniciar controle" (perfil administrador) confirma com a senha do administrador
    if (sessao.obter().perfil === 'administrador') {
      const senha = await solicitarSenhaAdministrador({
        administrador, titulo: 'Confirme seu acesso', mensagem: `Para ${acao}, informe novamente a senha do administrador.`,
      });
      return senha ? { login: 'administrador', nome: 'Administrador' } : null;
    }
    return solicitarCredenciais({
      controladores: obterBaseParaSalvar().controladores || [],
      titulo: 'Confirme seu acesso',
      mensagem: `Para ${acao}, confirme o controlador e informe a senha novamente.`,
      loginPadrao: sessao.obter().usuario ? sessao.obter().usuario.login : undefined,
    });
  }

  const logoDaBase = () => ((obterBaseParaSalvar() || {}).identidade || {}).logo;

  async function salvarNaNuvem() {
    const quem = await confirmarAcesso('salvar na nuvem');
    if (!quem) return;
    const nome = await solicitarValor({
      titulo: 'Salvar na nuvem',
      rotulo: 'Nome do salvamento',
      obrigatorio: true,
      regras: { minCaracteres: 3, maxCaracteres: 80 },
      valor: `${prefixoArquivo} ${formatarData(new Date(), 'data-hora')}`,
      textoConfirmar: 'Salvar',
    });
    if (nome == null) return;
    const car = mostrarCarregamento('salvar', nome, { logo: logoDaBase() });
    try {
      const versao = await armazenamento.salvar({ nome, base: prepararBaseParaSalvar(baseAtual()), autor: quem.nome });
      await car.fim(true);
      sessao.limparAlteracoes(`Nuvem: ${versao.nome}`);
      toast.sucesso('Salvo na nuvem', `${versao.nome} — por ${quem.nome}`);
      atualizarAba();
    } catch (erro) {
      await car.fim(false, 'Não foi possível salvar');
      toast.erro('Falha ao salvar', erro.message);
    }
  }

  async function salvarNaBaseExistente() {
    const quem = await confirmarAcesso('substituir um salvamento existente');
    if (!quem) return;
    await abrirListaVersoes({
      armazenamento,
      titulo: 'Salvar na base existente',
      textoAcao: 'Substituir',
      varianteAcao: 'warning',
      onEscolher: async (versao) => {
        const ok = await confirmar({
          titulo: `Substituir "${versao.nome}"?`,
          mensagem: `O conteúdo salvo em ${formatarData(versao.salvoEm, 'data-hora')} será trocado pelos dados atuais.`,
          textoConfirmar: 'Substituir',
          perigo: true,
        });
        if (!ok) return false;
        const car = mostrarCarregamento('salvar', versao.nome, { logo: logoDaBase() });
        try {
          const nova = await armazenamento.substituir(versao.id, { base: prepararBaseParaSalvar(baseAtual()), autor: quem.nome });
          await car.fim(true);
          sessao.limparAlteracoes(`Nuvem: ${nova.nome}`);
          toast.sucesso('Base substituída', `${nova.nome} — por ${quem.nome}`);
          atualizarAba();
          return true;
        } catch (erro) {
          await car.fim(false, 'Não foi possível salvar');
          toast.erro('Falha ao substituir', erro.message);
          return false;
        }
      },
    });
  }

  function exportarArquivo() {
    const nome = nomeArquivoBase(prefixoArquivo);
    baixarJSON(prepararBaseParaSalvar(baseAtual()), nome);
    sessao.limparAlteracoes(nome);
    toast.sucesso('Arquivo exportado', nome);
    atualizarAba();
  }

  function ferramentas() {
    const estado = sessao.obter();
    const blocos = [];
    if (sessao.podeEditar()) {
      if (estado.alteracoes) {
        blocos.push(criarAlerta({ tipo: 'warning', titulo: 'Alterações não salvas', mensagem: `Há ${estado.alteracoes} alteração(ões) feitas nesta sessão que ainda não foram gravadas.` }));
      }
      blocos.push(criarPainel({
        titulo: 'Salvar', icone: 'salvar',
        conteudo: h('div', { class: 'ctc-stack' },
          armazenamento ? h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Salvar na nuvem', icone: 'upload', variante: 'primary', onClick: salvarNaNuvem }),
            criarBotao({ texto: 'Salvar na base existente', icone: 'salvar', variante: 'secondary', onClick: salvarNaBaseExistente })) : null,
          armazenamento && armazenamento.descricao
            ? h('p', { class: 'ctc-text-xs ctc-text-muted' }, `Local de armazenamento: ${armazenamento.descricao}. Os dois salvamentos pedem login e senha novamente.`)
            : null,
          h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Exportar arquivo JSON', icone: 'download', variante: 'outline', tamanho: 'sm', onClick: exportarArquivo }),
            h('span', { class: 'ctc-text-xs ctc-text-muted' }, 'Cópia em arquivo, para guardar ou enviar.'))),
      }).elemento);
      if (typeof onEditarCabecalho === 'function') {
        blocos.push(criarPainel({
          titulo: 'Cabeçalho e logo', icone: 'editar',
          conteudo: h('div', { class: 'ctc-cluster' },
            criarBotao({ texto: 'Editar cabeçalho e logo', icone: 'editar', variante: 'outline', onClick: onEditarCabecalho }),
            h('span', { class: 'ctc-text-xs ctc-text-muted' }, 'A alteração é gravada na base no próximo salvamento.')),
        }).elemento);
      }
    } else {
      blocos.push(criarAlerta({ tipo: 'info', titulo: 'Modo visualizador', mensagem: 'Salvamento e edição do cabeçalho estão disponíveis somente para controladores.' }));
    }
    return h('div', { class: 'ctc-stack' }, blocos);
  }

  function painelSaida() {
    return criarPainel({
      titulo: 'Sessão de uso', icone: 'sair',
      conteudo: h('div', { class: 'ctc-stack' },
        h('p', { class: 'ctc-text-sm ctc-text-muted' }, 'Volta à tela inicial para trocar de perfil ou abrir outra base.'),
        criarBotao({
          texto: 'Trocar perfil / Sair', icone: 'sair', variante: 'outline',
          onClick: async () => {
            const pendentes = sessao.obter().alteracoes;
            if (pendentes && sessao.podeEditar()) {
              const ok = await confirmar({ titulo: 'Sair sem salvar?', mensagem: `As ${pendentes} alteração(ões) não salvas serão perdidas.`, textoConfirmar: 'Sair sem salvar', perigo: true });
              if (!ok) return;
            }
            modal.fechar();
            if (typeof onSair === 'function') onSair();
          },
        })),
    }).elemento;
  }

  function infoSessao() {
    const e = sessao.obter();
    const linhas = [
      { item: 'Perfil', valor: ROTULO_PERFIL[e.perfil] || '—' },
      { item: 'Usuário', valor: e.usuario ? `${e.usuario.nome} (${e.usuario.login})` : '—' },
      { item: 'Base em uso', valor: e.nomeArquivo || 'Base de demonstração (não importada)' },
      { item: 'Último salvamento', valor: e.ultimoSalvamento ? formatarData(e.ultimoSalvamento, 'data-hora') : '—' },
      { item: 'Alterações não salvas', valor: String(e.alteracoes) },
    ];
    const tabela = criarTabela({
      compacta: true, altura: 'auto', cabecalhoClaro: true, dados: linhas,
      colunas: [{ campo: 'item', titulo: 'Item', ordenavel: false }, { campo: 'valor', titulo: 'Valor', ordenavel: false }],
    }).elemento;
    return h('div', { class: 'ctc-stack' }, tabela, painelSaida());
  }

  abas = criarAbas({
    abas: [
      { id: 'ferramentas', texto: 'Ferramentas', conteudo: ferramentas },
      { id: 'sessao', texto: 'Sessão', conteudo: infoSessao },
      ...abasExtras,
    ],
  });

  modal = criarModal({ titulo, tamanho: 'lg', destruirAoFechar: true, conteudo: abas.elemento });
  modal.abrir();
  return modal;
}


/* =============================================================================
   v1.7: TELA DE BOAS-VINDAS E TELA DE CARREGAMENTO (visual do Controle de Custos)
   ========================================================================== */

const ehImagem = (v) => typeof v === 'string' && /^(data:image|https?:|blob:|\.{0,2}\/)/.test(v);

/** Cores predominantes de uma imagem (ignora preto, branco e cinza). cb(['#rrggbb', ...] | null) */
const _coresDaLogo = new Map();
function coresDaLogo(src, cb) {
  if (!ehImagem(src)) { cb(null); return; }
  const chave = `${src.length}:${src.slice(-40)}`;
  if (_coresDaLogo.has(chave)) { cb(_coresDaLogo.get(chave)); return; }
  const im = new Image();
  im.onload = () => {
    let cores = null;
    try {
      const r = Math.min(1, 64 / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(im.width * r));
      cv.height = Math.max(1, Math.round(im.height * r));
      const cx = cv.getContext('2d');
      cx.drawImage(im, 0, 0, cv.width, cv.height);
      const px = cx.getImageData(0, 0, cv.width, cv.height).data;
      const bins = {};
      for (let i = 0; i < px.length; i += 4) {
        if (px[i + 3] < 200) continue;
        const R = px[i] / 255; const G = px[i + 1] / 255; const B = px[i + 2] / 255;
        const mx = Math.max(R, G, B); const d = mx - Math.min(R, G, B);
        if (mx < 0.18 || d / mx < 0.35) continue;
        let hh = mx === R ? ((G - B) / d) % 6 : mx === G ? (B - R) / d + 2 : (R - G) / d + 4;
        hh = (hh * 60 + 360) % 360;
        const o = bins[Math.round(hh / 20) % 18] || (bins[Math.round(hh / 20) % 18] = { n: 0, r: 0, g: 0, b: 0, h: 0 });
        o.n += 1; o.r += px[i]; o.g += px[i + 1]; o.b += px[i + 2]; o.h += hh;
      }
      const lista = Object.values(bins).filter((o) => o.n >= 4).sort((a, b) => b.n - a.n).slice(0, 4)
        .map((o) => ({ h: o.h / o.n, cor: `#${[o.r, o.g, o.b].map((v) => (`0${Math.round(v / o.n).toString(16)}`).slice(-2)).join('')}` }))
        .sort((a, b) => b.h - a.h);
      cores = lista.length ? lista.map((o) => o.cor) : null;
    } catch (erro) { cores = null; }
    _coresDaLogo.set(chave, cores);
    cb(cores);
  };
  im.onerror = () => cb(null);
  im.src = src;
}

function marcaDaTela(logo, classe, textoPadrao) {
  const el = h('div', { class: classe });
  if (ehImagem(logo)) { const img = h('img', { alt: '' }); img.src = logo; el.append(img); } else el.append(h('span', {}, logo || textoPadrao));
  return el;
}

/**
 * Boas-vindas ao entrar no aplicativo: o app desfocado ao fundo e um cartao de vidro
 * com a logo e a saudacao. Some em 5 s ou com qualquer clique/tecla.
 *   mostrarBoasVindas({ nome, perfil: 'Controlador', visualizador, aplicativo: 'Controle X', local, logo })
 */
let _bvTimer = null;
function mostrarBoasVindas({ nome = '', perfil = '', visualizador = false, aplicativo = '', local = '', logo } = {}) {
  let o = document.getElementById('ctc-boasvindas');
  if (!o) {
    o = h('div', { id: 'ctc-boasvindas', role: 'dialog', 'aria-label': 'Boas-vindas' });
    document.body.append(o);
    o.addEventListener('mousedown', fecharBoasVindas);
    o.addEventListener('touchstart', fecharBoasVindas, { passive: true });
  }
  const hora = new Date().getHours();
  const saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
  const chips = [local && `📍 ${local}`, perfil && `👤 ${perfil}`, `📅 ${new Date().toLocaleDateString('pt-BR')}`].filter(Boolean);
  const cont = h('div', { class: 'ctc-boasvindas__cont' });
  // SVG fixo deste arquivo (sem dados do usuario)
  cont.innerHTML = '<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" stroke="#e2e8f0" stroke-width="3" fill="none"/>'
    + '<circle class="ctc-boasvindas__anel" cx="18" cy="18" r="15" stroke-width="3" fill="none" stroke-linecap="round" transform="rotate(-90 18 18)"/></svg>';
  cont.append(h('span', {}, 'Entrando…'));
  o.replaceChildren(h('div', { class: 'ctc-boasvindas__card' },
    marcaDaTela(logo, 'ctc-boasvindas__logo', '📊'),
    h('h2', { class: 'ctc-boasvindas__ola' }, visualizador || !nome ? `${saudacao}!` : `${saudacao}, ${nome}`),
    h('div', { class: 'ctc-boasvindas__obra' }, `Bem-vindo(a) ao ${aplicativo || 'aplicativo'}`),
    h('div', { class: 'ctc-boasvindas__chips' }, chips.map((c) => h('span', {}, c))),
    cont));
  coresDaLogo(logo, (c) => o.style.setProperty('--bv-cor', (c && c[0]) || '#1e3a5f'));
  o.classList.remove('on', 'saindo');
  void o.offsetWidth;
  o.classList.add('on');
  clearTimeout(_bvTimer);
  _bvTimer = setTimeout(fecharBoasVindas, 5000);
  setTimeout(() => document.addEventListener('keydown', fecharBoasVindas, true), 150);
}

function fecharBoasVindas(e) {
  const o = document.getElementById('ctc-boasvindas');
  if (!o || !o.classList.contains('on') || o.classList.contains('saindo')) return;
  if (e && e.type === 'keydown') { e.preventDefault(); e.stopPropagation(); }
  clearTimeout(_bvTimer);
  document.removeEventListener('keydown', fecharBoasVindas, true);
  o.classList.add('saindo');
  setTimeout(() => o.classList.remove('on', 'saindo'), 480);
}

/**
 * Tela de carregamento: logo ao centro, barra nas cores da logo e etapas sendo marcadas.
 *   const car = mostrarCarregamento('json' | 'nuvem' | 'salvar', 'nome do arquivo', { logo, rodape, titulo, etapas });
 *   await car.fim(true)                 // conclui (marca tudo e fecha)
 *   await car.fim(false, 'Mensagem')    // erro (marca a etapa em vermelho e fecha)
 * As etapas andam sozinhas ate a penultima; a ultima so fecha quando o trabalho termina.
 */
const ETAPAS_CARREGAMENTO = {
  json: { titulo: 'Carregando base de dados', etapas: ['Lendo o arquivo da base', 'Conferindo a estrutura dos dados', 'Carregando os registros', 'Calculando totais e indicadores', 'Base pronta'] },
  nuvem: { titulo: 'Carregando base de dados', etapas: ['Baixando da nuvem', 'Conferindo a estrutura dos dados', 'Carregando os registros', 'Calculando totais e indicadores', 'Base pronta'] },
  salvar: { titulo: 'Salvando na nuvem', etapas: ['Preparando os dados', 'Enviando para a nuvem', 'Confirmando o salvamento'] },
};
function mostrarCarregamento(tipo, sub = '', { logo, rodape = '', titulo, etapas } = {}) {
  const def = ETAPAS_CARREGAMENTO[tipo] || { titulo: 'Carregando', etapas: ['Carregando'] };
  let o = document.getElementById('ctc-carregando');
  if (!o) {
    o = h('div', { id: 'ctc-carregando', role: 'status', 'aria-live': 'polite' });
    document.body.append(o);
  }
  const elTit = h('span', { class: 'ctc-carregando__tit' }, titulo || def.titulo);
  const elPct = h('span', { class: 'ctc-carregando__pct' }, '0%');
  const elBarra = h('i');
  const itens = (etapas || def.etapas).map((t) => h('li', {}, h('span', { class: 'ic' }), h('span', { class: 'tx' }, t)));
  o.replaceChildren(marcaDaTela(logo, 'ctc-carregando__marca', 'Carregando'),
    h('div', { class: 'ctc-carregando__caixa' },
      h('div', { class: 'ctc-carregando__lin' }, elTit, elPct),
      h('div', { class: 'ctc-carregando__barra' }, elBarra),
      h('div', { class: 'ctc-carregando__sub' }, sub),
      h('ul', { class: 'ctc-carregando__etapas' }, itens)),
    h('div', { class: 'ctc-carregando__rod' }, rodape));
  coresDaLogo(logo, (c) => {
    let cores = c && c.length ? c : ['#1e3a5f', '#2f6f5e'];
    if (cores.length === 1) cores = [cores[0], cores[0]];
    o.style.setProperty('--car-g', `linear-gradient(90deg,${cores.join(',')})`);
    o.style.setProperty('--car-c1', cores[0]);
  });
  const n = itens.length;
  const alvo = Math.max(0, n - 2);
  let at = 0;
  let pronto = false;
  let acabou = false;
  const inicio = Date.now();
  const desenhar = () => {
    itens.forEach((li, j) => { if (li.className !== 'er') li.className = j < at ? 'ok' : j === at ? 'at' : ''; });
    const pct = o.classList.contains('ok') ? 100 : Math.min(95, Math.round((at / n) * 100));
    elBarra.style.width = `${o.classList.contains('erro') ? Math.max(pct, 8) : pct}%`;
    elPct.textContent = `${pct}%`;
  };
  o.classList.remove('ok', 'saindo', 'erro', 'pronto');
  void o.offsetWidth;
  o.classList.add('on');
  desenhar();
  const tPronto = setTimeout(() => { pronto = true; o.classList.add('pronto'); desenhar(); }, 700);
  const passo = setInterval(() => { if (pronto && at < alvo) { at += 1; desenhar(); } }, 380);
  const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
  return {
    async fim(ok = true, texto = '') {
      if (acabou) return;
      acabou = true;
      while (ok && (at < alvo || Date.now() - inicio < 1500)) await esperar(120);
      clearTimeout(tPronto);
      clearInterval(passo);
      o.classList.add('pronto');
      if (ok) {
        at = n;
        o.classList.add('ok');
        desenhar();
        await esperar(550);
      } else {
        if (itens[at]) itens[at].className = 'er';
        o.classList.add('erro');
        elTit.textContent = texto || 'Não foi possível concluir';
        desenhar();
        await esperar(1400);
      }
      o.classList.add('saindo');
      await esperar(340);
      o.classList.remove('on', 'saindo', 'ok', 'erro', 'pronto');
    },
  };
}

const FIREBASE_KZ = {
  apiKey: 'AIzaSyCk1hdv3h8A2gDOcaZDRuRtceDiG2bvXOc',
  authDomain: 'kz-planejamento-e-custos.firebaseapp.com',

  appId: '1:755715307647:web:6573d0437b23b880bae74a',
};
const NOME_CONTROLE_KZ = 'Controle de Combustível';
const CONTROLE_KZ_PADRAO = 'combustivel';               // codigo do controle no catalogo do Portal
const LINK_CONTROLE_KZ = 'controle-de-combustivel';     // trecho do link do controle cadastrado no Portal
const ID_BASE_OBRA = 'principal';
const NOME_PAPEL_KZ = { leitor: 'Leitor', editor: 'Editor', admin: 'Admin' };

const KZ = (() => {
  let pronto = null;

  function traduzir(erro) {
    const c = (erro && (erro.code || erro.message)) || String(erro);
    if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'E-mail ou senha incorretos.';
    if (/too-many-requests/.test(c)) return 'Muitas tentativas. Aguarde alguns minutos ou redefina a senha.';
    if (/network-request-failed|unavailable/.test(c)) return 'Sem conexão com a internet.';
    if (/user-disabled/.test(c)) return 'Usuário desativado. Fale com o gestor.';
    if (/permission/i.test(c)) return 'Você não tem permissão para esta ação no Portal KZ.';
    if (/importing|dynamically imported module|Failed to load module|Failed to fetch/i.test(c)) return 'Não foi possível carregar o Firebase. Verifique a internet.';
    return c;
  }

  /** App padrao do Firebase com a config da KZ: o login fica compartilhado com o Portal. */
  function iniciar() {
    if (!pronto) {
      pronto = (async () => {
        const endereco = `https://www.gstatic.com/firebasejs/${VERSAO_SDK_FIREBASE}`;
        const [moduloApp, fa, fs] = await Promise.all([
          import(`${endereco}/firebase-app.js`),
          import(`${endereco}/firebase-auth.js`),
          import(`${endereco}/firebase-firestore.js`),
        ]);
        const padrao = moduloApp.getApps().find((a) => a.name === '[DEFAULT]');
        const app = !padrao ? moduloApp.initializeApp(FIREBASE_KZ)
          : (padrao.options.projectId === FIREBASE_KZ.projectId ? padrao
            : (moduloApp.getApps().find((a) => a.name === 'kz-portal') || moduloApp.initializeApp(FIREBASE_KZ, 'kz-portal')));
        return { auth: fa.getAuth(app), db: fs.getFirestore(app), fa, fs };
      })().catch((erro) => { pronto = null; throw new Error(traduzir(erro)); });
    }
    return pronto;
  }

  async function executar(operacao) {
    try { return await operacao(await iniciar()); } catch (erro) { throw new Error(traduzir(erro)); }
  }

  const usuarioAtual = () => executar(({ auth, fa }) => new Promise((resolver) => {
    const parar = fa.onAuthStateChanged(auth, (u) => { parar(); resolver(u && !u.isAnonymous ? u : null); });
  }));
  const entrar = (email, senha) => executar(({ auth, fa }) => fa.signInWithEmailAndPassword(auth, String(email).trim(), senha));
  const redefinirSenha = (email) => executar(({ auth, fa }) => fa.sendPasswordResetEmail(auth, String(email).trim()));

  /** Obra: vem do Portal (?obra=wsf3) ou da ultima obra escolhida no Portal (mesmo site). */
  function obraDaUrl() {
    let o = new URLSearchParams(window.location.search).get('obra');
    if (!o) { try { o = localStorage.getItem('kz-portal-obra'); } catch (erro) { o = null; } }
    return String(o || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
  }

  function papelNoControle(membro, controle) {
    if (!membro) return '';
    if (membro.gestor) return 'admin';
    const papeis = membro.papeis || {};
    const papel = papeis[controle] || papeis['*'] || '';
    return NOME_PAPEL_KZ[papel] ? papel : '';
  }

  /** Codigo deste controle na obra: o controle cadastrado no Portal cujo link aponta para este app. */
  function codigoNaObra(obra) {
    const controles = (obra && obra.controles) || {};
    const porLink = Object.keys(controles).find((k) => String((controles[k] || {}).url || '').toLowerCase().includes(LINK_CONTROLE_KZ));
    return porLink || CONTROLE_KZ_PADRAO;
  }

  const acessoNaObra = (obra) => executar(async ({ auth, db, fs }) => {
    const u = auth.currentUser;
    const [gg, m, o, cadastro] = await Promise.all([
      fs.getDoc(fs.doc(db, 'gestores_gerais', u.uid)),
      fs.getDoc(fs.doc(db, 'obras', obra, 'membros', u.uid)),
      fs.getDoc(fs.doc(db, 'obras', obra)),
      fs.getDoc(fs.doc(db, 'usuarios', u.uid)),
    ]);
    const nome = (cadastro.exists() && cadastro.data().nome) || u.displayName || u.email;
    if (!o.exists()) return { papel: '', gestor: false, controle: CONTROLE_KZ_PADRAO, obra: null, nome };
    const dadosObra = { id: obra, ...o.data() };
    const controle = codigoNaObra(dadosObra);
    const papel = gg.exists() ? 'admin' : (m.exists() ? papelNoControle(m.data(), controle) : '');
    const gestor = gg.exists() || Boolean(m.exists() && m.data().gestor);
    return { papel, gestor, controle, obra: dadosObra, nome };
  });

  const obrasComAcesso = () => executar(async ({ auth, db, fs }) => {
    const u = auth.currentUser;
    const [gg, obras] = await Promise.all([fs.getDoc(fs.doc(db, 'gestores_gerais', u.uid)), fs.getDocs(fs.collection(db, 'obras'))]);
    const lista = await Promise.all(obras.docs.map(async (d) => {
      const o = { id: d.id, ...d.data() };
      if (o.situacao === 'encerrada' && !gg.exists()) return null;
      let papel = gg.exists() ? 'admin' : '';
      if (!papel) {
        const m = await fs.getDoc(fs.doc(db, 'obras', d.id, 'membros', u.uid)).catch(() => null);
        if (m && m.exists()) papel = papelNoControle(m.data(), codigoNaObra(o));
      }
      return papel ? { id: o.id, nome: o.nome, sigla: o.sigla, papel } : null;
    }));
    return lista.filter(Boolean).sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  });

  /** Divide o texto em pacotes de ate ~900 KB (o Firestore aceita no maximo 1 MB por documento). */
  function dividirEmPacotes(texto, maxBytes = 900000) {
    const cod = new TextEncoder();
    const pacotes = [];
    let i = 0;
    while (i < texto.length) {
      let fim = Math.min(texto.length, i + maxBytes);
      while (cod.encode(texto.slice(i, fim)).length > maxBytes) fim = i + Math.floor((fim - i) * 0.9);
      const c = texto.charCodeAt(fim - 1);
      if (fim < texto.length && c >= 0xd800 && c <= 0xdbff) fim -= 1;
      pacotes.push(texto.slice(i, fim));
      i = fim;
    }
    return pacotes.length ? pacotes : [''];
  }

  /**
   * Base unica da obra:
   *   obras/{obra}/{controle}/principal                          -> { salvoEm, autor, tamanho, pacotes, slot }
   *   obras/{obra}/{controle}_conteudo/principal/pacotes/{slot}000.. -> { texto }
   * Grava no slot que nao esta em uso e so no fim troca o apontador: se a internet cair
   * no meio, a versao anterior segue inteira.
   */
  function criarNuvemObra({ obra, controle }) {
    const refMeta = (db, fs) => fs.doc(db, 'obras', obra, controle, ID_BASE_OBRA);
    const refPacote = (db, fs, slot, i) => fs.doc(db, 'obras', obra, `${controle}_conteudo`, ID_BASE_OBRA, 'pacotes', `${slot}${String(i).padStart(3, '0')}`);
    const meta = () => executar(async ({ db, fs }) => {
      const m = await fs.getDoc(refMeta(db, fs));
      return m.exists() ? m.data() : null;
    });
    return {
      meta,
      ler: () => executar(async ({ db, fs }) => {
        const m = await fs.getDoc(refMeta(db, fs));
        if (!m.exists()) return null;
        const d = m.data();
        const partes = await Promise.all(Array.from({ length: d.pacotes || 0 }, (_, i) => fs.getDoc(refPacote(db, fs, d.slot, i))));
        if (partes.some((p) => !p.exists())) throw new Error('Base da obra incompleta na nuvem (faltam pacotes).');
        const texto = partes.map((p) => p.data().texto).join('');
        if (d.tamanho && texto.length !== d.tamanho) throw new Error('Base da obra incompleta na nuvem (tamanho não confere).');
        return { meta: d, base: JSON.parse(texto) };
      }),
      gravar: (base, autor) => executar(async ({ db, fs }) => {
        const atual = await fs.getDoc(refMeta(db, fs));
        const slot = atual.exists() && atual.data().slot === 'a' ? 'b' : 'a';
        const texto = JSON.stringify(base);
        const pacotes = dividirEmPacotes(texto);
        for (let i = 0; i < pacotes.length; i += 5) {
          const lote = fs.writeBatch(db);
          pacotes.slice(i, i + 5).forEach((t, j) => lote.set(refPacote(db, fs, slot, i + j), { texto: t }));
          await lote.commit();
        }
        const novo = { salvoEm: new Date().toISOString(), autor: autor || '', tamanho: texto.length, pacotes: pacotes.length, slot };
        await fs.setDoc(refMeta(db, fs), novo);
        return novo;
      }),
    };
  }

  return { usuarioAtual, entrar, redefinirSenha, obraDaUrl, acessoNaObra, obrasComAcesso, criarNuvemObra };
})();

/** Modal de escolha (lista ou botao segmentado). Retorna o valor escolhido ou null. */
function escolherOpcao({ titulo, rotulo, opcoes, valor, texto, segmentado = false }) {
  return new Promise((resolver) => {
    let resposta = null;
    let atual = valor ?? opcoes[0].valor;
    const seletor = segmentado
      ? criarSegmentado({ rotulo, opcoes, valor: atual, onMudar: (v) => { atual = v; } })
      : null;
    const formulario = segmentado ? null : criarFormulario({
      colunas: 1, semBotoes: true, valores: { opcao: atual },
      campos: [{ nome: 'opcao', rotulo, tipo: 'select', obrigatorio: true, opcoes }],
      onEnviar: ({ opcao }) => { resposta = opcao; modal.fechar(); },
    });
    const modal = criarModal({
      titulo, tamanho: 'sm', destruirAoFechar: true,
      conteudo: [texto ? h('p', { class: 'ctc-text-sm ctc-text-muted' }, texto) : null, segmentado ? seletor.elemento : formulario.elemento],
      onFechar: () => resolver(resposta),
      acoes: [
        { texto: 'Cancelar', variante: 'outline' },
        {
          texto: 'Continuar', variante: 'primary', fechar: false,
          onClick: () => { if (segmentado) { resposta = atual; modal.fechar(); } else formulario.enviar(); },
        },
      ],
    });
    modal.abrir();
  });
}

function garantirLoginKZ({ pedirLogin = true } = {}) {
  if (usuarioKZ) return Promise.resolve(usuarioKZ);
  if (!garantindoKZ) {
    garantindoKZ = (async () => {
      let user = await KZ.usuarioAtual();
      if (!user && pedirLogin) user = await pedirLoginKZ();
      if (!user) throw new Error('Login cancelado.');
      if (!obraNuvem) {
        const escolhida = await escolherObraKZ();
        if (!escolhida) throw new Error('Nenhuma obra escolhida (cancelado).');
        obraNuvem = escolhida;
      }
      const acesso = await KZ.acessoNaObra(obraNuvem);
      if (!acesso.obra) throw new Error(`A obra "${obraNuvem}" não existe no Portal KZ. Confira o link recebido.`);
      if (!acesso.papel) throw new Error(`Seu login (${user.email}) não tem acesso ao ${NOME_CONTROLE_KZ} na obra ${acesso.obra.sigla || obraNuvem}. Fale com o gestor da obra.`);
      nuvemObra = KZ.criarNuvemObra({ obra: obraNuvem, controle: acesso.controle });
      usuarioKZ = { email: user.email, nome: acesso.nome, papel: acesso.papel, gestor: acesso.gestor, sigla: acesso.obra.sigla || obraNuvem, obra: obraNuvem, controle: acesso.controle };
      try { localStorage.setItem('kz-portal-obra', obraNuvem); } catch (erro) { /* sem armazenamento */ }
      atualizarBlocoPortal();
      return usuarioKZ;
    })().finally(() => { garantindoKZ = null; });
  }
  return garantindoKZ;
}

/** Grava a base atual na obra (todos os que entram pelo Portal veem esta versao). */
async function salvarNaObra() {
  if (!modoPortal || !nuvemObra || !sessao.podeEditar()) return;
  try {
    const remoto = await nuvemObra.meta();
    if (remoto && remoto.salvoEm !== salvoEmCarregado) {
      const ok = await confirmar({
        titulo: 'Outra pessoa salvou depois que você abriu',
        mensagem: `${remoto.autor || 'Alguém'} salvou em ${formatarData(remoto.salvoEm, 'data-hora')}. Se salvar agora, o que essa pessoa gravou será substituído pelo que está na sua tela. `
          + 'Para não perder nada: cancele, anote os seus lançamentos novos, use "Atualizar" e lance de novo.',
        textoConfirmar: 'Salvar mesmo assim',
        perigo: true,
      });
      if (!ok) return;
    }
    const base = { ...obterBaseParaSalvar(), salvoEm: new Date().toISOString() };
    const meta = await nuvemObra.gravar(base, quemEsta());
    salvoEmCarregado = meta.salvoEm;
    sessao.limparAlteracoes(sessao.obter().nomeArquivo);
    toast.sucesso('Salvo na obra', `${usuarioKZ.sigla} · ${formatarData(meta.salvoEm, 'data-hora')}`);
  } catch (erro) {
    toast.erro('Não foi possível salvar na obra', erro.message);
  }
}

/** Recarrega a base da obra (o que os outros salvaram). */
async function atualizarDaObra() {
  if (!modoPortal || !nuvemObra) return;
  if (sessao.obter().alteracoes && !(await confirmar({
    titulo: 'Descartar o que não foi salvo?',
    mensagem: 'Há alterações na sua tela que ainda não foram salvas na obra. Ao atualizar, elas serão perdidas.',
    textoConfirmar: 'Atualizar mesmo assim',
    perigo: true,
  }))) return;
  try {
    const lido = await nuvemObra.ler();
    if (!lido) { toast.info('Nada salvo na obra ainda'); return; }
    const { perfil, usuario, nomeArquivo } = sessao.obter();
    sessao.iniciar({ perfil, usuario, base: lido.base, nomeArquivo });
    carregarDados(lido.base);
    salvoEmCarregado = lido.meta.salvoEm;
    atualizarPagina();
    toast.sucesso('Dados atualizados', `Salvo por ${lido.meta.autor || '—'} em ${formatarData(lido.meta.salvoEm, 'data-hora')}`);
  } catch (erro) {
    toast.erro('Não foi possível atualizar', erro.message);
  }
}

/* =============================================================================
   01. DADOS
   dados = {
     maquinas:       [{ id, codigo, descricao, tipo, ativa }],
     abastecimentos: [{ id, data, maquinaId, litros, horimetro, observacao,
                        lancadoPor, lancadoEm, nfId }],      // nfId null = pendente de NF
     nfs:            [{ id, numero, emissao, fornecedor, valorUnitario, litrosNf,
                        vinculadaPor, vinculadaEm }],
   }
   ========================================================================== */

const AVISO_FICTICIO = 'Todos os dados exibidos são fictícios, gerados apenas para demonstração.';
const TIPOS_MAQUINA = ['Escavadeira', 'Retroescavadeira', 'Pá carregadeira', 'Caminhão', 'Rolo compactador', 'Motoniveladora', 'Gerador', 'Trator', 'Outro'];

let maquinas = [];
let abastecimentos = [];
let nfs = [];

function proximoIdDe(lista) {
  return lista.reduce((maior, r) => Math.max(maior, Number(r.id) || 0), 0) + 1;
}

/** Base usada quando nenhum JSON e importado: dados ficticios, sem controladores. */
function criarBaseDemonstrativa() {
  const maqs = [
    { id: 1, codigo: 'DEMO-ESC-01', descricao: 'Escavadeira fictícia 01', tipo: 'Escavadeira', ativa: true },
    { id: 2, codigo: 'DEMO-RET-01', descricao: 'Retroescavadeira fictícia 01', tipo: 'Retroescavadeira', ativa: true },
    { id: 3, codigo: 'DEMO-CAM-01', descricao: 'Caminhão basculante fictício 01', tipo: 'Caminhão', ativa: true },
    { id: 4, codigo: 'DEMO-ROL-01', descricao: 'Rolo compactador fictício 01', tipo: 'Rolo compactador', ativa: true },
    { id: 5, codigo: 'DEMO-GER-01', descricao: 'Gerador fictício 01', tipo: 'Gerador', ativa: true },
  ];
  const hoje = new Date();
  const abs = [];
  let id = 1;
  for (let d = 20; d >= 0; d -= 1) {
    const dia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - d);
    if (dia.getDay() === 0) continue;   // sem abastecimento aos domingos
    maqs.forEach((m, i) => {
      if ((d + i) % 2 !== 0 && m.id !== 5) return;
      abs.push({
        id, data: formatarData(dia, 'iso'), maquinaId: m.id,
        litros: 40 + ((d * 17 + i * 23) % 90),
        horimetro: null, observacao: '',
        lancadoPor: 'Pessoa Fictícia 1', lancadoEm: dia.toISOString(), nfId: null,
      });
      id += 1;
    });
  }
  const dataIso = (dias) => formatarData(new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - dias), 'iso');
  const notas = [
    { id: 1, numero: 'DEMO-0001', emissao: dataIso(13), fornecedor: 'Fornecedor Fictício Ltda.', valorUnitario: 6.19, litrosNf: null, vinculadaPor: 'Pessoa Fictícia 2', vinculadaEm: new Date().toISOString() },
    { id: 2, numero: 'DEMO-0002', emissao: dataIso(6), fornecedor: 'Fornecedor Fictício Ltda.', valorUnitario: 6.24, litrosNf: null, vinculadaPor: 'Pessoa Fictícia 2', vinculadaEm: new Date().toISOString() },
  ];
  abs.forEach((a) => {
    if (a.data <= dataIso(14)) a.nfId = 1;
    else if (a.data <= dataIso(7)) a.nfId = 2;
  });
  notas.forEach((n) => { n.litrosNf = somar(abs.filter((a) => a.nfId === n.id), 'litros'); n.descricao = 'Óleo diesel S10 (fictício)'; });
  notas[1].litrosNf += 15;   // divergencia ficticia para demonstrar o alerta
  notas.forEach((n) => { n.valorTotal = Math.round(n.litrosNf * n.valorUnitario * 100) / 100; });
  return { ...criarBaseVazia(FORMATO_BASE), dados: { maquinas: maqs, abastecimentos: abs, nfs: notas } };
}

/** Carrega os dados de uma base (importada ou de demonstracao) para o estado do app. */
function carregarDados(base) {
  const dados = base.dados || {};
  maquinas = Array.isArray(dados.maquinas) ? dados.maquinas : [];
  abastecimentos = Array.isArray(dados.abastecimentos) ? dados.abastecimentos : [];
  nfs = Array.isArray(dados.nfs) ? dados.nfs : [];
}

/** Monta a base atual (controladores + dados editados) para o salvamento. */
function obterBaseParaSalvar() {
  const { base } = sessao.obter();
  return { ...base, identidade, dados: { ...base.dados, maquinas, abastecimentos, nfs } };
}


/* =============================================================================
   02. UTILITARIOS
   ========================================================================== */

const arred2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const fmtLitros = (n) => `${formatarNumero(Number(n) || 0)} L`;
const fmtUnit = (n) => (n == null ? '—' : formatarMoeda(n, { casas: 4 }).replace(/0{1,2}$/, ''));

function maquinaPorId(id) {
  return maquinas.find((m) => m.id === Number(id)) || null;
}
function nomeMaquina(id) {
  const m = maquinaPorId(id);
  return m ? `${m.codigo} · ${m.descricao}` : '(equipamento removido)';
}
function nfPorId(id) {
  return nfs.find((n) => n.id === Number(id)) || null;
}
function quemEsta() {
  const { usuario, perfil } = sessao.obter();
  return usuario ? usuario.nome : NOME_PERFIL[perfil] || 'Usuário';
}
function opcoesMaquinas(soAtivas = true) {
  return ordenar(maquinas.filter((m) => !soAtivas || m.ativa !== false), 'codigo')
    .map((m) => ({ valor: String(m.id), texto: `${m.codigo} · ${m.descricao}` }));
}

/** Linhas da tabela de abastecimentos, com campos calculados para exibir e filtrar. */
function linhasAbastecimento(lista = abastecimentos) {
  return lista.map((a) => {
    const nf = nfPorId(a.nfId);
    return {
      ...a,
      maquina: nomeMaquina(a.maquinaId),
      situacao: nf ? 'Com NF' : 'Pendente de NF',
      nfNumero: nf ? nf.numero : '',
      valorUnitario: nf ? nf.valorUnitario : null,
      valorTotal: nf ? arred2(a.litros * nf.valorUnitario) : null,
      ref: a,
    };
  });
}

/** Resumo de uma NF: litros lancados, valor total e diferenca para a NF. */
function resumoNf(nf) {
  const lista = abastecimentos.filter((a) => a.nfId === nf.id);
  const litros = somar(lista, 'litros');
  return {
    ...nf,
    qtd: lista.length,
    litrosLancados: litros,
    diferenca: nf.litrosNf != null ? arred2(nf.litrosNf - litros) : null,
    valorTotal: arred2(somar(lista.map((a) => ({ v: arred2(a.litros * nf.valorUnitario) })), 'v')),
    valorNf: nf.litrosNf != null ? arred2(nf.litrosNf * nf.valorUnitario) : null,
    ref: nf,
  };
}

function atualizarPagina() {
  if (appAtual) appAtual.navegar(appAtual.paginaAtual());
}

function alertaFicticio() {
  if (!baseDemonstrativa) return null;
  return criarAlerta({ tipo: 'info', titulo: 'Ambiente de demonstração', mensagem: AVISO_FICTICIO, fechavel: true });
}

/* =============================================================================
   04. VINCULAR NF (janela)
   Empresa, descricao, quantidade (L), valor unitario e valor total (= unitario x
   quantidade, automatico). Embaixo, os abastecimentos ainda sem NF: o interruptor
   escolhe os que entram nesta NF.
   ========================================================================== */

function camposNf(nfAtual = null) {
  return [
    {
      nome: 'numero', rotulo: 'Nº da NF', obrigatorio: true,
      regras: { validar: (v) => (nfs.some((n) => n !== nfAtual && String(n.numero).trim() === String(v).trim()) ? 'Esta NF já foi lançada.' : true) },
    },
    { nome: 'emissao', rotulo: 'Data da NF', tipo: 'data', obrigatorio: true },
    { nome: 'fornecedor', rotulo: 'Empresa', obrigatorio: true },
    { nome: 'descricao', rotulo: 'Descrição', larguraTotal: true, placeholder: 'ex.: Óleo diesel S10' },
    { nome: 'litrosNf', rotulo: 'Quantidade (L)', tipo: 'numero', sufixo: 'L', obrigatorio: true, regras: { minimo: 0.01 } },
    { nome: 'valorUnitario', rotulo: 'Valor unitário (R$/L)', tipo: 'numero', prefixo: 'R$', obrigatorio: true, regras: { minimo: 0.0001 }, dica: 'Aceita até 4 casas, ex.: 6,1890' },
    { nome: 'valorTotal', rotulo: 'Valor total', tipo: 'moeda', somenteLeitura: true, dica: 'Quantidade × valor unitário' },
  ];
}

/** Liga o calculo automatico do valor total num formulario de NF. */
function ligarValorTotal(formulario, aoMudar) {
  const campoTotal = formulario.elemento.querySelector('[name="valorTotal"]');
  const calcular = () => {
    const v = formulario.obterValores();
    const total = v.litrosNf != null && v.valorUnitario != null ? valorTotalNf(v) : null;
    if (campoTotal) campoTotal.value = total == null ? '' : formatarMoeda(total, { simbolo: false });
    if (typeof aoMudar === 'function') aoMudar(v);
  };
  formulario.elemento.addEventListener('input', calcular);
  formulario.elemento.addEventListener('change', calcular);
  calcular();
}

function abrirVincularNf() {
  const pendentes = ordenar(linhasAbastecimento(abastecimentos.filter((a) => !a.nfId)), [{ campo: 'data' }, { campo: 'maquina' }]);
  if (!pendentes.length) {
    toast.info('Nenhum abastecimento sem NF', 'Lance os abastecimentos antes de vincular a NF.');
    return;
  }
  const marcados = new Set();
  const interruptores = new Map();
  const fornecedores = nfs.map((n) => n.fornecedor).filter(Boolean);

  const kLitros = criarKpi({ rotulo: 'Litros marcados', valor: '0 L', sub: '0 abastecimentos' });
  const kNf = criarKpi({ rotulo: 'Quantidade da NF', valor: '—' });
  const kDif = criarKpi({ rotulo: 'Diferença (NF − marcados)', valor: '—' });

  let formulario = null;
  function atualizarResumo() {
    const sel = pendentes.filter((p) => marcados.has(p.id));
    const litros = somar(sel, 'litros');
    const v = formulario ? formulario.obterValores() : {};
    kLitros.atualizar({ valor: fmtLitros(litros), sub: `${sel.length} abastecimentos` });
    kNf.atualizar({ valor: v.litrosNf != null ? fmtLitros(v.litrosNf) : '—' });
    if (v.litrosNf != null && sel.length) {
      const dif = arred2(v.litrosNf - litros);
      kDif.atualizar({ valor: `${dif > 0 ? '+' : ''}${formatarNumero(dif)} L`, sub: dif ? 'confira antes de vincular' : 'litros conferem', destaque: dif ? 'negative' : 'positive' });
    } else {
      kDif.atualizar({ valor: '—', sub: '', destaque: 'neutral' });
    }
  }

  const tabela = criarTabela({
    dados: pendentes,
    porPagina: 0,
    compacta: true,
    altura: 'auto',
    colunas: [
      {
        campo: 'marcar', titulo: 'Incluir', ordenavel: false,
        render: (_, l) => {
          const s = criarLinhaInterruptor({
            texto: '', ligado: marcados.has(l.id),
            onMudar: (on) => { if (on) marcados.add(l.id); else marcados.delete(l.id); atualizarResumo(); },
          });
          interruptores.set(l.id, s);
          return s.elemento;
        },
      },
      { campo: 'data', titulo: 'Data', tipo: 'data' },
      { campo: 'maquina', titulo: 'Equipamento' },
      { campo: 'litros', titulo: 'Litros', tipo: 'numero', total: 'soma' },
      { campo: 'lancadoPor', titulo: 'Lançado por' },
      { campo: 'observacao', titulo: 'Observação' },
    ],
  });

  const marcarTodos = (on) => {
    pendentes.forEach((p) => { if (on) marcados.add(p.id); else marcados.delete(p.id); interruptores.get(p.id)?.definir(on); });
    atualizarResumo();
  };

  formulario = criarFormulario({
    colunas: 3, semBotoes: true,
    valores: { emissao: formatarData(new Date(), 'iso'), fornecedor: fornecedores[fornecedores.length - 1] || '', descricao: 'Óleo diesel' },
    campos: camposNf(),
    onEnviar: async (v) => {
      const sel = pendentes.filter((p) => marcados.has(p.id));
      if (!sel.length) { toast.aviso('Nenhum abastecimento ligado', 'Ligue os abastecimentos que entram nesta NF.'); return; }
      const litros = somar(sel, 'litros');
      const dif = arred2(v.litrosNf - litros);
      const ok = await confirmar({
        titulo: `Vincular NF ${v.numero}?`,
        mensagem: `${sel.length} abastecimentos (${fmtLitros(litros)}) · NF ${fmtLitros(v.litrosNf)} × ${fmtUnit(v.valorUnitario)} = ${formatarMoeda(valorTotalNf(v))}.`
          + (dif ? ` Atenção: diferença de ${formatarNumero(dif)} L entre a NF e os abastecimentos marcados.` : ''),
        textoConfirmar: 'Vincular',
      });
      if (!ok) return;
      const nf = {
        id: proximoIdDe(nfs), numero: String(v.numero).trim(), emissao: v.emissao,
        fornecedor: v.fornecedor, descricao: v.descricao || '',
        litrosNf: v.litrosNf, valorUnitario: v.valorUnitario, valorTotal: valorTotalNf(v),
        vinculadaPor: quemEsta(), vinculadaEm: new Date().toISOString(),
      };
      nfs.push(nf);
      sel.forEach((p) => { p.ref.nfId = nf.id; });
      sessao.marcarAlteracao();
      toast.sucesso(`NF ${nf.numero} vinculada`, `${sel.length} abastecimentos · ${formatarMoeda(nf.valorTotal)}`);
      modal.fechar();
      abaAtiva = 'notas';
      atualizarPagina();
    },
  });
  ligarValorTotal(formulario, atualizarResumo);

  const modal = criarModal({
    titulo: 'Vincular NF',
    tamanho: 'xl',
    destruirAoFechar: true,
    conteudo: h('div', { class: 'ctc-stack' },
      formulario.elemento,
      h('div', { class: 'ctc-cluster' },
        h('strong', {}, `Abastecimentos sem NF (${pendentes.length})`),
        h('span', { class: 'ctc-spacer' }),
        criarBotao({ texto: 'Ligar todos', icone: 'check', variante: 'outline', tamanho: 'sm', onClick: () => marcarTodos(true) }),
        criarBotao({ texto: 'Desligar todos', icone: 'fechar', variante: 'ghost', tamanho: 'sm', onClick: () => marcarTodos(false) })),
      tabela.elemento,
      h('div', { class: 'ctc-grid ctc-grid--3' }, kLitros.elemento, kNf.elemento, kDif.elemento)),
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      { texto: 'Vincular NF', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
    ],
  });
  modal.abrir();
  atualizarResumo();
}

function abrirModalEditarNf(nf) {
  const formulario = criarFormulario({
    colunas: 3, semBotoes: true, valores: nf,
    campos: camposNf(nf),
    onEnviar: async (v) => {
      Object.assign(nf, {
        numero: String(v.numero).trim(), emissao: v.emissao, fornecedor: v.fornecedor, descricao: v.descricao || '',
        litrosNf: v.litrosNf, valorUnitario: v.valorUnitario, valorTotal: valorTotalNf(v),
      });
      sessao.marcarAlteracao();
      toast.sucesso(`NF ${nf.numero} atualizada`);
      modal.fechar();
      atualizarPagina();
    },
  });
  ligarValorTotal(formulario);
  const modal = criarModal({
    titulo: `Editar NF ${nf.numero}`, tamanho: 'lg', destruirAoFechar: true,
    conteudo: formulario.elemento,
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      { texto: 'Salvar alterações', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
    ],
  });
  modal.abrir();
}

async function desvincularNf(nf) {
  const qtd = abastecimentos.filter((a) => a.nfId === nf.id).length;
  const ok = await confirmar({
    titulo: `Desvincular NF ${nf.numero}?`,
    mensagem: `A NF será removida e os ${qtd} abastecimentos voltam a ficar sem NF. Os lançamentos não são apagados.`,
    textoConfirmar: 'Desvincular',
    perigo: true,
  });
  if (!ok) return;
  abastecimentos.forEach((a) => { if (a.nfId === nf.id) a.nfId = null; });
  nfs.splice(nfs.indexOf(nf), 1);
  sessao.marcarAlteracao();
  toast.aviso(`NF ${nf.numero} desvinculada`, `${qtd} abastecimentos voltaram para "sem NF".`);
  atualizarPagina();
}

function extrairRelatorio(id, botao = null) {
  const executar = async () => {
    try {
      const nome = await exportarExcel([Number(id)]);
      toast.sucesso('Relatório extraído', nome);
    } catch (erro) {
      toast.erro('Não foi possível gerar o relatório', erro.message);
    }
  };
  if (botao) comCarregamento(botao, executar); else executar();
}

function abaRelatorios() {
  if (!nfs.length) {
    return criarAlerta({ tipo: 'info', titulo: 'Nenhuma NF lançada', mensagem: 'Vincule uma NF na tela do controle para extrair o relatório.' });
  }
  const lista = ordenar([...nfs], 'emissao', 'desc');
  let escolhida = lista[0].id;
  const previa = h('div', {});

  function desenhar() {
    const nf = nfPorId(escolhida);
    const r = resumoNf(nf);
    previa.replaceChildren(h('div', { class: 'ctc-stack' },
      h('div', { class: 'ctc-grid ctc-grid--4' },
        criarKpi({ rotulo: 'Quantidade NF', valor: fmtLitros(nf.litrosNf || 0) }).elemento,
        criarKpi({ rotulo: 'Valor unitário', valor: fmtUnit(nf.valorUnitario) }).elemento,
        criarKpi({ rotulo: 'Valor total NF', valor: formatarMoeda(r.valorNf), variante: 'accent', tema: 1 }).elemento,
        criarKpi({ rotulo: 'Abastecimentos', valor: r.qtd, formato: 'numero', sub: fmtLitros(r.litrosLancados) }).elemento),
      r.diferenca ? criarAlerta({ tipo: 'warning', mensagem: `A NF tem ${formatarNumero(r.diferenca)} L de diferença em relação aos abastecimentos vinculados.` }) : null,
      criarTabela({
        dados: montarRelatorio([nf.id], false), porPagina: 0, compacta: true, altura: 'auto', rotuloTotal: 'Total',
        colunas: [
          { campo: 'equipamento', titulo: 'Equipamento' },
          { campo: 'qtd', titulo: 'Abast.', tipo: 'numero', total: 'soma' },
          { campo: 'litros', titulo: 'Litros', tipo: 'numero', total: 'soma' },
          { campo: 'valorUnitario', titulo: 'Valor unitário', formatar: (v) => fmtUnit(v) },
          { campo: 'valorTotal', titulo: 'Valor total', tipo: 'moeda', total: 'soma' },
        ],
      }).elemento));
  }

  const formulario = criarFormulario({
    colunas: 1, semBotoes: true, valores: { nf: String(escolhida) },
    campos: [{
      nome: 'nf', rotulo: 'Nota fiscal', tipo: 'select', obrigatorio: true,
      opcoes: lista.map((n) => ({ valor: String(n.id), texto: `NF ${n.numero} · ${formatarData(n.emissao)} · ${n.fornecedor}` })),
    }],
  });
  formulario.elemento.addEventListener('change', () => { escolhida = Number(formulario.obterValores().nf); desenhar(); });

  const botao = criarBotao({ texto: 'Extrair relatório (Excel)', icone: 'excel', variante: 'success' });
  botao.addEventListener('click', () => extrairRelatorio(escolhida, botao));

  desenhar();
  return h('div', { class: 'ctc-stack' },
    formulario.elemento,
    h('div', { class: 'ctc-cluster' }, h('span', { class: 'ctc-spacer' }), botao),
    previa);
}

function abrirModalAbastecimento(registro = null) {
  if (!maquinas.some((m) => m.ativa !== false)) {
    toast.aviso('Cadastre um equipamento primeiro', 'Use o botão "Cadastrar equipamento".');

    campos: camposAbastecimento(),
    semBotoes: true,
    valores: editando
      ? { ...registro, maquinaId: String(registro.maquinaId) }

    onEnviar: async (v) => {
      const dados = {
        data: v.data, maquinaId: Number(v.maquinaId), litros: v.litros,
        horimetro: v.horimetro ?? null, observacao: v.observacao || '',
      };
      if (editando) {
        Object.assign(registro, dados);
        toast.sucesso('Abastecimento atualizado', `${nomeMaquina(dados.maquinaId)} — ${fmtLitros(dados.litros)}`);
      } else {
        abastecimentos.push({
          id: proximoIdDe(abastecimentos), ...dados,
          lancadoPor: quemEsta(), lancadoEm: new Date().toISOString(), nfId: null,
        });
        toast.sucesso('Abastecimento lançado', `${nomeMaquina(dados.maquinaId)} — ${fmtLitros(dados.litros)}`);
      }
      sessao.marcarAlteracao();
      if (continuar) {
        formulario.preencher({ data: v.data, maquinaId: '', litros: '', horimetro: '', observacao: '' });

  const modal = criarModal({
    titulo: editando ? 'Editar abastecimento' : 'Lançar abastecimento',
    tamanho: 'md',
    conteudo: [
      nf ? criarAlerta({ tipo: 'warning', mensagem: `Este abastecimento já está na NF ${nf.numero}. Alterar os litros muda o valor da NF.` }) : null,
      formulario.elemento,
    ],
    destruirAoFechar: true,
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      editando ? null : { texto: 'Lançar e continuar', variante: 'outline', fechar: false, onClick: () => { continuar = true; formulario.enviar(); } },
      { texto: editando ? 'Salvar alterações' : 'Lançar', variante: 'primary', fechar: false, onClick: () => { continuar = false; formulario.enviar(); } },
    ].filter(Boolean),
  });
  modal.abrir();
}

async function excluirAbastecimento(registro) {
  if (registro.nfId) {
    toast.aviso('Abastecimento com NF', 'Desvincule a NF em Notas fiscais antes de excluir.');
    return;
  }
  const ok = await confirmar({
    titulo: 'Excluir abastecimento?',
    mensagem: `${formatarData(registro.data)} — ${nomeMaquina(registro.maquinaId)} — ${fmtLitros(registro.litros)}`,
    textoConfirmar: 'Excluir',
    perigo: true,
  });
  if (!ok) return;

    tipo: 'warning', titulo: 'Abastecimento excluído',
    acoes: [{
      texto: 'Desfazer',
      onClick: () => { abastecimentos.splice(posicao, 0, registro); sessao.marcarAlteracao(); atualizarPagina(); },
    }],
  });
}
