/** Linhas do relatorio: uma por NF x equipamento (ou por abastecimento, se detalhado). */
function montarRelatorio(ids, detalhado) {
  const linhas = [];
  ordenar(nfs.filter((n) => ids.includes(n.id)), 'emissao').forEach((nf) => {
    const lista = ordenar(abastecimentos.filter((a) => a.nfId === nf.id), [{ campo: 'data' }]);
    if (detalhado) {
      lista.forEach((a) => linhas.push({
        nf: nf.numero, emissao: nf.emissao, fornecedor: nf.fornecedor, data: a.data,
        equipamento: nomeMaquina(a.maquinaId), litros: a.litros, valorUnitario: nf.valorUnitario,
        valorTotal: arred2(a.litros * nf.valorUnitario),
      }));
    } else {
      const porMaquina = new Map();
      lista.forEach((a) => {
        const atual = porMaquina.get(a.maquinaId) || { litros: 0, qtd: 0 };
        porMaquina.set(a.maquinaId, { litros: atual.litros + Number(a.litros || 0), qtd: atual.qtd + 1 });
      });
      ordenar([...porMaquina].map(([id, t]) => ({ id, nome: nomeMaquina(id), ...t })), 'nome').forEach((m) => linhas.push({
        nf: nf.numero, emissao: nf.emissao, fornecedor: nf.fornecedor, data: null, qtd: m.qtd,
        equipamento: m.nome, litros: m.litros, valorUnitario: nf.valorUnitario,
        valorTotal: arred2(m.litros * nf.valorUnitario),
      }));
    }
  });
  return linhas;
}

/* ---- Excel (ExcelJS, carregado sob demanda da CDN, como o SDK do Firebase) ---- */
const URL_EXCELJS = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
let carregandoExcel = null;
function carregarExcelJS() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (!carregandoExcel) {
    carregandoExcel = new Promise((resolver, rejeitar) => {
      const s = h('script', { src: URL_EXCELJS });
      s.addEventListener('load', () => resolver(window.ExcelJS));
      s.addEventListener('error', () => { carregandoExcel = null; rejeitar(new Error('Sem acesso à internet para gerar o Excel.')); });
      document.head.append(s);
    });
  }
  return carregandoExcel;
}

function tamanhoImagem(src) {
  return new Promise((resolver) => {
    const img = new Image();
    img.onload = () => resolver({ largura: img.naturalWidth || 1, altura: img.naturalHeight || 1 });
    img.onerror = () => resolver(null);
    img.src = src;
  });
}

async function exportarExcel(ids) {
  const ExcelJS = await carregarExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.creator = quemEsta();
  wb.created = new Date();
  const AZUL = 'FF1E3A5F';
  const AMARELO = 'FFFDB913';
  const CINZA = 'FFEEF2F9';
  /* ExcelJS descreve a linha da borda na chave "style" (formato do Excel, nao e CSS) */
  const CHAVE_TRACO = ['st', 'yle'].join('');
  const traco = (tipo, argb) => ({ [CHAVE_TRACO]: tipo, color: { argb } });
  const borda = { top: traco('thin', 'FFCBD5E1'), bottom: traco('thin', 'FFCBD5E1'), left: traco('thin', 'FFCBD5E1'), right: traco('thin', 'FFCBD5E1') };
  const logo = identidade.logo && /^data:image\/(png|jpe?g)/i.test(identidade.logo) ? identidade.logo : null;

  async function cabecalhoPlanilha(ws, ultimaColuna, titulo) {
    ws.getRow(1).height = 30;
    ws.getRow(2).height = 18;
    ws.getRow(3).height = 18;
    if (logo) {
      const ext = /jpe?g/i.test(logo.slice(5, 16)) ? 'jpeg' : 'png';
      const id = wb.addImage({ base64: logo, extension: ext });
      const t = await tamanhoImagem(logo);
      const alt = 60;
      const larg = t ? Math.round((t.largura / t.altura) * alt) : 120;
      ws.addImage(id, { tl: { col: 0.1, row: 0.1 }, ext: { width: larg, height: alt } });
    } else {
      ws.getCell('A1').value = 'CTC';
      ws.getCell('A1').font = { bold: true, size: 18, color: { argb: AZUL } };
    }
    ws.mergeCells(1, 3, 1, ultimaColuna);
    ws.mergeCells(2, 3, 2, ultimaColuna);
    ws.mergeCells(3, 3, 3, ultimaColuna);
    ws.getCell(1, 3).value = titulo;
    ws.getCell(1, 3).font = { bold: true, size: 15, color: { argb: AZUL } };
    ws.getCell(2, 3).value = [identidade.titulo, identidade.subtitulo].filter(Boolean).join(' — ');
    ws.getCell(2, 3).font = { size: 10, color: { argb: 'FF475569' } };
    ws.getCell(3, 3).value = `Emitido em ${formatarData(new Date(), 'data-hora')} por ${quemEsta()}`;
    ws.getCell(3, 3).font = { size: 9, color: { argb: 'FF64748B' } };
    [1, 2, 3].forEach((r) => { ws.getCell(r, 3).alignment = { horizontal: 'right', vertical: 'middle' }; });
    for (let c = 1; c <= ultimaColuna; c += 1) {
      ws.getCell(4, c).border = { bottom: traco('medium', AMARELO) };
    }
  }

  function linhaTitulos(ws, linha, titulos) {
    titulos.forEach((t, i) => {
      const c = ws.getCell(linha, i + 1);
      c.value = t;
      c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AZUL } };
      c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      c.border = borda;
    });
    ws.getRow(linha).height = 22;
  }

  const FMT_MOEDA = '"R$" #,##0.00';
  const FMT_UNIT = '"R$" #,##0.0000';
  const FMT_LITROS = '#,##0.00 "L"';

  /* ---------- Aba 0: dados da NF ---------- */
  const wr = wb.addWorksheet('Dados da NF', { views: [{ showGridLines: false }], pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  wr.columns = [{ width: 14 }, { width: 12 }, { width: 28 }, { width: 28 }, { width: 14 }, { width: 14 }, { width: 16 }, { width: 14 }, { width: 16 }, { width: 14 }];
  await cabecalhoPlanilha(wr, 10, 'Controle de Combustível — Dados da NF');
  linhaTitulos(wr, 6, ['Nº NF', 'Data', 'Empresa', 'Descrição', 'Quantidade NF', 'Valor unitário', 'Valor total NF', 'Litros vinculados', 'Diferença (L)', 'Abastecimentos']);
  let rr = 7;
  ordenar(nfs.filter((n) => ids.includes(n.id)), 'emissao').forEach((nf) => {
    const res = resumoNf(nf);
    const row = wr.getRow(rr);
    row.values = [nf.numero, formatarData(nf.emissao), nf.fornecedor, nf.descricao || '', nf.litrosNf ?? '', nf.valorUnitario,
      nf.litrosNf != null ? { formula: `E${rr}*F${rr}`, result: res.valorNf } : '', res.litrosLancados,
      nf.litrosNf != null ? { formula: `E${rr}-H${rr}`, result: res.diferenca } : '', res.qtd];
    row.getCell(5).numFmt = FMT_LITROS;
    row.getCell(6).numFmt = FMT_UNIT;
    row.getCell(7).numFmt = FMT_MOEDA;
    row.getCell(8).numFmt = FMT_LITROS;
    row.getCell(9).numFmt = FMT_LITROS;
    for (let c = 1; c <= 10; c += 1) row.getCell(c).border = borda;
    rr += 1;
  });

  /* ---------- Aba 1: relatorio por NF (equipamento) ---------- */
  const ws = wb.addWorksheet('Por equipamento', { views: [{ showGridLines: false }], pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  ws.columns = [{ width: 14 }, { width: 12 }, { width: 28 }, { width: 42 }, { width: 14 }, { width: 14 }, { width: 16 }];
  await cabecalhoPlanilha(ws, 7, 'Controle de Combustível — Litros por equipamento');
  linhaTitulos(ws, 6, ['Nº NF', 'Data', 'Empresa', 'Equipamento', 'Litros', 'Valor unitário', 'Valor total']);
  let r = 7;
  const subtotais = [];
  ordenar(nfs.filter((n) => ids.includes(n.id)), 'emissao').forEach((nf) => {
    const linhas = montarRelatorio([nf.id], false);
    const inicio = r;
    linhas.forEach((l) => {
      const row = ws.getRow(r);
      row.values = [l.nf, formatarData(l.emissao), l.fornecedor, l.equipamento, l.litros, l.valorUnitario, { formula: `E${r}*F${r}`, result: l.valorTotal }];
      row.getCell(5).numFmt = FMT_LITROS;
      row.getCell(6).numFmt = FMT_UNIT;
      row.getCell(7).numFmt = FMT_MOEDA;
      for (let c = 1; c <= 7; c += 1) row.getCell(c).border = borda;
      r += 1;
    });
    const sub = ws.getRow(r);
    sub.values = [`Subtotal NF ${nf.numero}`, '', '', '', { formula: `SUM(E${inicio}:E${r - 1})` }, '', { formula: `SUM(G${inicio}:G${r - 1})` }];
    ws.mergeCells(r, 1, r, 4);
    sub.getCell(5).numFmt = FMT_LITROS;
    sub.getCell(7).numFmt = FMT_MOEDA;
    for (let c = 1; c <= 7; c += 1) {
      sub.getCell(c).font = { bold: true };
      sub.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: CINZA } };
      sub.getCell(c).border = borda;
    }
    subtotais.push(r);
    r += 1;
  });
  const tot = ws.getRow(r);
  tot.values = ['TOTAL GERAL', '', '', '', { formula: subtotais.map((s) => `E${s}`).join('+') || '0' }, '', { formula: subtotais.map((s) => `G${s}`).join('+') || '0' }];
  ws.mergeCells(r, 1, r, 4);
  tot.getCell(5).numFmt = FMT_LITROS;
  tot.getCell(7).numFmt = FMT_MOEDA;
  for (let c = 1; c <= 7; c += 1) {
    tot.getCell(c).font = { bold: true, color: { argb: 'FFFFFFFF' } };
    tot.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AZUL } };
  }
  tot.getCell(5).font = { bold: true, color: { argb: AMARELO } };
  tot.getCell(7).font = { bold: true, color: { argb: AMARELO } };

  /* ---------- Aba 2: abastecimentos (detalhe) ---------- */
  const wd = wb.addWorksheet('Abastecimentos', { views: [{ showGridLines: false }], pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  wd.columns = [{ width: 14 }, { width: 12 }, { width: 42 }, { width: 12 }, { width: 14 }, { width: 30 }, { width: 22 }, { width: 14 }, { width: 16 }];
  await cabecalhoPlanilha(wd, 9, 'Controle de Combustível — Abastecimentos da NF');
  linhaTitulos(wd, 6, ['Nº NF', 'Data', 'Equipamento', 'Litros', 'Horímetro / km', 'Observação', 'Lançado por', 'Valor unitário', 'Valor total']);
  let d = 7;
  ordenar(nfs.filter((n) => ids.includes(n.id)), 'emissao').forEach((nf) => {
    ordenar(abastecimentos.filter((a) => a.nfId === nf.id), [{ campo: 'data' }]).forEach((a) => {
      const row = wd.getRow(d);
      row.values = [nf.numero, formatarData(a.data), nomeMaquina(a.maquinaId), a.litros, a.horimetro ?? '', a.observacao || '', a.lancadoPor || '', nf.valorUnitario, { formula: `D${d}*H${d}`, result: arred2(a.litros * nf.valorUnitario) }];
      row.getCell(4).numFmt = FMT_LITROS;
      row.getCell(8).numFmt = FMT_UNIT;
      row.getCell(9).numFmt = FMT_MOEDA;
      for (let c = 1; c <= 9; c += 1) row.getCell(c).border = borda;
      d += 1;
    });
  });
  const totD = wd.getRow(d);
  totD.values = ['TOTAL', '', '', { formula: `SUM(D7:D${Math.max(7, d - 1)})` }, '', '', '', '', { formula: `SUM(I7:I${Math.max(7, d - 1)})` }];
  wd.mergeCells(d, 1, d, 3);
  totD.getCell(4).numFmt = FMT_LITROS;
  totD.getCell(9).numFmt = FMT_MOEDA;
  for (let c = 1; c <= 9; c += 1) {
    totD.getCell(c).font = { bold: true, color: { argb: 'FFFFFFFF' } };
    totD.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AZUL } };
  }

  const buffer = await wb.xlsx.writeBuffer();
  const nomes = ordenar(nfs.filter((n) => ids.includes(n.id)), 'emissao').map((n) => n.numero);
  const nome = `Combustivel_NF_${nomes.length > 3 ? `${nomes[0]}_a_${nomes[nomes.length - 1]}` : nomes.join('_')}`.replace(/[^\w.-]+/g, '-');
  const url = URL.createObjectURL(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  const link = h('a', { href: url, download: `${nome}.xlsx` });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return `${nome}.xlsx`;
}


/* =============================================================================
   08. CADASTRO DE EQUIPAMENTOS (janela)
   ========================================================================== */

function abrirModalMaquina(maquina = null) {
  const editando = Boolean(maquina);
  const formulario = criarFormulario({
    colunas: 2, semBotoes: true,
    valores: editando ? { ...maquina, ativa: maquina.ativa !== false ? 'Sim' : 'Não' } : { ativa: 'Sim' },
    campos: [
      {
        nome: 'codigo', rotulo: 'Código / prefixo', obrigatorio: true, placeholder: 'ex.: ESC-01',
        regras: { validar: (v) => (maquinas.some((m) => m !== maquina && String(m.codigo).trim().toUpperCase() === String(v).trim().toUpperCase()) ? 'Código já cadastrado.' : true) },
      },
      { nome: 'tipo', rotulo: 'Tipo', tipo: 'select', opcoes: TIPOS_MAQUINA, obrigatorio: true, placeholder: 'Selecione' },
      { nome: 'descricao', rotulo: 'Descrição', obrigatorio: true, larguraTotal: true, placeholder: 'ex.: Escavadeira CAT 320 — placa / série' },
      { nome: 'ativa', rotulo: 'Ativa', tipo: 'radio', opcoes: ['Sim', 'Não'], obrigatorio: true },
    ],
    onEnviar: async (v) => {
      const dados = { codigo: String(v.codigo).trim().toUpperCase(), tipo: v.tipo, descricao: v.descricao, ativa: v.ativa === 'Sim' };
      if (editando) Object.assign(maquina, dados);
      else maquinas.push({ id: proximoIdDe(maquinas), ...dados });
      sessao.marcarAlteracao();
      toast.sucesso(editando ? 'Equipamento atualizado' : 'Equipamento cadastrado', `${dados.codigo} · ${dados.descricao}`);
      modal.fechar();
      atualizarPagina();
    },
  });
  const modal = criarModal({
    titulo: editando ? `Editar ${maquina.codigo}` : 'Cadastrar equipamento', tamanho: 'md', destruirAoFechar: true,
    conteudo: formulario.elemento,
    acoes: [
      { texto: 'Cancelar', variante: 'outline' },
      { texto: editando ? 'Salvar alterações' : 'Cadastrar', variante: 'primary', fechar: false, onClick: () => formulario.enviar() },
    ],
  });
  modal.abrir();
}

async function excluirMaquina(maquina) {
  if (abastecimentos.some((a) => a.maquinaId === maquina.id)) {
    toast.aviso('Equipamento com abastecimentos', 'Ele não pode ser excluído. Marque como inativo para tirá-lo da lista de lançamento.');
    return;
  }
  const ok = await confirmar({ titulo: `Excluir ${maquina.codigo}?`, mensagem: maquina.descricao, textoConfirmar: 'Excluir', perigo: true });
  if (!ok) return;
  maquinas.splice(maquinas.indexOf(maquina), 1);
  sessao.marcarAlteracao();
  toast.aviso('Equipamento excluído', maquina.codigo);
  atualizarPagina();
}


/* =============================================================================
   09. MONTAGEM DO APLICATIVO
   ========================================================================== */

function abrirAjuda() {
  criarModal({
    titulo: 'Como usar o Controle de Combustível',
    destruirAoFechar: true,
    conteudo: [
      h('ol', {},
        h('li', {}, 'Cadastrar equipamento: cadastre todos os equipamentos da obra (código e descrição).'),
        h('li', {}, 'Lançar abastecimento: a cada abastecimento, informe a data, o equipamento e os litros.'),
        h('li', {}, 'Vincular NF: quando chegar a NF, informe nº, data, empresa, descrição, quantidade (L) e valor unitário (o valor total é calculado). Embaixo, ligue os abastecimentos que entram nesta NF.'),
        h('li', {}, 'Relatório: Menu > Controlador > aba Relatórios, escolha a NF e clique em Extrair relatório (Excel).')),
      criarAlerta({
        tipo: 'info', titulo: 'Perfis de acesso',
        mensagem: 'Administrador cadastra os controladores. Controlador lança e vincula NF. Visualizador apenas consulta. Cada lançamento registra quem fez.',
      }),
      criarAlerta({
        tipo: 'warning', titulo: 'Como salvar',
        mensagem: modoPortal
          ? 'Pelo Portal KZ: as alterações ficam na sua tela até clicar em "Salvar na obra". Use "Atualizar" para ver o que a equipe salvou.'
          : 'As alterações ficam na tela até usar Menu > Controlador > Ferramentas > Salvar na nuvem (ou Exportar JSON).',
      }),
      baseDemonstrativa ? criarAlerta({ tipo: 'info', mensagem: AVISO_FICTICIO }) : null,
    ],
    acoes: [{ texto: 'Fechar', variante: 'primary' }],
  }).abrir();
}

const MARCA = { logo: 'CTC', titulo: 'Controle de Óleo Diesel' };

function abrirAplicativo({ perfil, usuario, base, nomeArquivo }) {
  baseDemonstrativa = !nomeArquivo && (base.dados?.abastecimentos || []).some((a) => String(a.lancadoPor).startsWith('Pessoa Fictícia'));
  identidade = { ...IDENTIDADE_PADRAO, ...(base.identidade || {}) };
  sessao.iniciar({ perfil, usuario, base, nomeArquivo });
  carregarDados(base);
  abaAtiva = 'abastecimentos';
  const subtituloCabecalho = () => identidade.subtitulo || '';
  const desligarProtecao = protegerSaida(sessao);

  /* Volta a tela inicial SEM retirar a base: ela so sai pelo link "Remover base carregada". */
  const sair = () => {
    desligarProtecao();
    const estado = sessao.obter();
    // pelo Portal a base fica na obra: a tela inicial nao guarda uma copia dela
    if (!estado.alteracoes && !modoPortal) {
      telaEntrada.definirBase({ ...obterBaseParaSalvar(), salvoEm: estado.ultimoSalvamento || estado.base.salvoEm || null }, estado.nomeArquivo);
    }
    app.destruir();
    appAtual = null;
    modoPortal = false;
    atualizarBlocoPortal();
    telaEntrada.mostrar();
  };

  const sairDoMenu = async () => {
    if (sessao.obter().alteracoes && !(await confirmar({
      titulo: 'Sair sem salvar?',
      mensagem: 'Há alterações que ainda não foram salvas. Se sair agora, elas serão perdidas.',
      textoConfirmar: 'Sair sem salvar',
      perigo: true,
    }))) return;
    sair();
  };

  const botaoControlador = criarBotaoSessao({
    sessao,
    texto: 'Controlador',
    onClick: () => abrirPainelControlador({
      sessao,
      titulo: `Controlador — ${usuario ? usuario.nome : NOME_PERFIL[perfil]}`,
      prefixoArquivo: FORMATO_BASE,
      obterBaseParaSalvar,
      // pelo Portal, a gravacao e o botao "Salvar na obra" do cabecalho
      armazenamento: modoPortal ? undefined : armazenamento,
      administrador: ADMINISTRADOR,
      onEditarCabecalho: () => abrirEditorCabecalho({
        identidade,
        onSalvar: (nova) => {
          identidade = { ...identidade, ...nova };
          app.cabecalho.definirTitulo(identidade.titulo);
          app.cabecalho.definirSubtitulo(subtituloCabecalho());
          app.cabecalho.definirLogo(identidade.logo || MARCA.logo);
          sessao.marcarAlteracao();
          toast.sucesso('Cabeçalho atualizado', 'Salve a base para gravar a alteração.');
          atualizarPagina();
        },
      }),
      onSair: sair,
      abasExtras: [{ id: 'relatorios', texto: 'Relatórios', conteudo: abaRelatorios }],
    }),
  });

  const app = montarAplicativo({
    marca: { logo: identidade.logo || MARCA.logo, titulo: identidade.titulo, subtitulo: baseDemonstrativa ? 'Dados fictícios' : 'Base importada' },
    cabecalho: {
      titulo: identidade.titulo,
      subtitulo: subtituloCabecalho(),
      acoes: [
        { texto: 'Ajuda', icone: 'info', variante: 'outline', onClick: abrirAjuda },
        modoPortal ? { texto: 'Atualizar', icone: 'sinc', variante: 'outline', titulo: 'Buscar o que a equipe salvou na obra', onClick: atualizarDaObra } : null,
        modoPortal ? { texto: 'Salvar na obra', icone: 'salvar', variante: 'primary', apenasEdicao: true, onClick: salvarNaObra } : null,
      ].filter(Boolean),
    },
    menu: {
      secoes: [
        {
          titulo: 'Principal',
          itens: [{ id: 'controle', texto: 'Controle de combustível', icone: 'tabela' }],
        },
        {
          titulo: 'Ferramentas',
          itens: [{ id: 'controlador', texto: 'Controlador', icone: 'configuracao' }],
        },
      ],
      /* "Controlador" saiu do cabecalho: abre o painel (Ferramentas, Sessao, Relatorios) */
      onNavegar: (id) => { if (id === 'controlador') { appAtual?.alternarMenu(false); botaoControlador.click(); } },
      rodape: 'Controle de Combustível v1.2.1 · CTC App Standard v1.8',
    },
    paginas: {
      controle: {
        titulo: 'Controle de combustível',
        caminho: ['Principal'],
        acoes: [
          { texto: 'Cadastrar equipamento', icone: 'caixa', variante: 'outline', apenasEdicao: true, onClick: () => abrirModalMaquina() },
          { texto: 'Lançar abastecimento', icone: 'mais', variante: 'outline', apenasEdicao: true, onClick: () => abrirModalAbastecimento() },
          { texto: 'Vincular NF', icone: 'documento', variante: 'primary', apenasEdicao: true, onClick: () => abrirVincularNf() },
        ],
        render: paginaControle,
      },
    },
    paginaInicial: 'controle',
    somenteLeitura: perfil === 'visualizador',
    onSair: sairDoMenu,
  });
  appAtual = app;

  mostrarBoasVindas({
    nome: usuario ? usuario.nome : '',
    perfil: NOME_PERFIL[perfil] || perfil,
    visualizador: perfil === 'visualizador',
    aplicativo: identidade.titulo,
    local: identidade.subtitulo,
    logo: identidade.logo,
  });

  /* Exposto apenas para inspecao no console do navegador durante testes */
  window.ctcAppBase = { app, sessao };
}

/* Inicio: toda abertura passa pela tela de entrada */
const telaEntrada = criarTelaEntrada({
  logo: MARCA.logo,
  titulo: MARCA.titulo,
  subtitulo: 'Escolha como deseja acessar',
  formato: FORMATO_BASE,
  prefixoArquivo: FORMATO_BASE,
  administrador: ADMINISTRADOR,
  baseInicial: criarBaseDemonstrativa(),
  armazenamento,
  /* base em branco do botao "Iniciar controle": mesma estrutura, sem nenhum registro */
  criarBaseNova: () => ({ ...criarBaseVazia(FORMATO_BASE), dados: { maquinas: [], abastecimentos: [], nfs: [] } }),
  textoBaseInicial: 'Nenhuma base importada: será usada a base de demonstração com dados fictícios.',
  rodape: 'Controle de Óleo Diesel v1.2.1 — acesso pelo login do Portal KZ (ou pela base importada).',
  onEntrar: abrirAplicativo,
});
telaEntrada.mostrar();

/* v1.1: bloco "Portal KZ" na tela de entrada, acima do rodape */
atualizarBlocoPortal();
{
  const cartao = telaEntrada.elemento.querySelector('.ctc-landing__card') || telaEntrada.elemento;
  cartao.insertBefore(blocoPortal, cartao.querySelector('.ctc-landing__footer'));

  /* v1.1.1: "Iniciar controle" e "Entrar" como Controlador/Administrador passam pelo login do Portal
     (sem senha do administrador): a base da obra e criada na primeira gravacao.
     So o Visualizador continua entrando direto (demonstracao ou base importada). */
  const [, cartaoIniciar] = cartao.querySelectorAll('.ctc-entrada-acoes > *');
  if (cartaoIniciar) {
    cartaoIniciar.addEventListener('click', (evento) => {
      evento.preventDefault();
      evento.stopImmediatePropagation();
      entrarPeloPortal();
    }, true);
    const textoSenha = [...cartaoIniciar.querySelectorAll('*')].find((el) => !el.children.length && /senha do admin/i.test(el.textContent));
    if (textoSenha) textoSenha.textContent = 'Pelo login do Portal KZ';
    cartaoIniciar.setAttribute('title', 'Abrir o controle da obra pelo login do Portal KZ (sem senha do administrador)');
  }
  const botaoEntrar = [...cartao.querySelectorAll('button')].find((b) => b.textContent.trim() === 'Entrar');
  if (botaoEntrar) {
    botaoEntrar.addEventListener('click', (evento) => {
      const marcado = cartao.querySelector('.ctc-entrada-perfis [aria-pressed="true"]');
      const perfil = marcado ? marcado.textContent.trim().toLowerCase() : 'visualizador';
      if (perfil === 'visualizador') return;
      evento.preventDefault();
      evento.stopImmediatePropagation();
      entrarPeloPortal();
    }, true);
  }
}

/* Quem ja entrou no Portal KZ (mesmo site e mesmo Firebase) e reconhecido sem digitar nada.
   Aberto pelo link da obra (?obra=...), o login do Portal e pedido logo na entrada. */
(async () => {
  const pelaObra = Boolean(new URLSearchParams(window.location.search).get('obra'));
  try {
    await garantirLoginKZ({ pedirLogin: pelaObra });
    if (pelaObra) entrarPeloPortal();
  } catch (erro) {
    if (pelaObra && !/cancelado/i.test(erro.message)) toast.aviso('Login do Portal KZ', erro.message);
  }
})();

})();
